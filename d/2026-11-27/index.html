ring provinces into the red. Finance Minister Jason Nixon says the province is wary of raising spending in case oil prices drop, saying 'we cannot take today's conditions for granted.'","digestN":61,"opinion":false},{"n":62,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Canadian dollar edges lower as investors await key GDP data","url":"https://www.theglobeandmail.com/investing/article-canadian-dollar-edges-lower-as-investors-await-key-gdp-data/","summary":"The loonie slipped 0.2% to 1.4242 per U.S. dollar (70.21 U.S. cents) Thursday, giving back some gains after the Bank of Canada said it may need to respond forcefully to supply shocks. Swaps imply about an 80% chance of a December hike. Monex Europe is skeptical a hike is warranted, given CPI-trim at 1.8% and three straight monthly job declines, and says Monday's Q3 GDP and next Friday's November jobs report are the real test of BoC pricing. Economists expect growth slowed in Q3 from Q2's 3.3% annualized pace. Global stocks gained as the latest U.S. tariffs looked less damaging than feared (Reuters).","digestN":62,"opinion":false},{"n":63,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"What to know about the proposed Telus takeover and possible telecom consolidation","url":"https://www.theglobeandmail.com/business/article-what-to-know-about-the-proposed-telus-takeover-and-possible-telecom/","summary":"Primer on the proposed Telus takeover, which would cut the national industry from four major carriers to three. Sources say Ottawa is willing to entertain consolidation despite its long-standing four-player policy. In mid-November Quebecor launched a $31-billion cash-and-stock proposal for Telus, now worth about $26-billion as share prices have moved, arguing a combined company could better invest in national networks and compete with Starlink. BCE has also hired financial and legal advisers and held preliminary talks with Telus, The Globe has reported. The piece covers the status of talks and what consolidation could mean for the sector and customers.","digestN":63,"opinion":false},{"n":64,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Jensen Huang survived his scandal, but China’s remote access to Nvidia chips didn’t","url":"https://www.theglobeandmail.com/world/article-jensen-huang-survived-his-scandal-but-chinas-remote-access-to-nvidia/","summary":"Singapore's Megaspeed grew from US$33-million to US$3-billion between 2023 and 2024 by buying high-end Nvidia chips and renting access through Southeast Asian data centres, mainly to Chinese customers cut off by export controls. It drew U.S. scrutiny late last year. This month, as Jensen Huang resigned over an affair with former Megaspeed executive Alice Huang, Washington closed the remote-computing loophole. Megaspeed was also sanctioned on suspicion it was actually smuggling chips into China. Huang was reinstated after Trump intervened, but the new rule may be the scandal's biggest legacy. Alibaba and Tencent warn it could slow their AI work, and it may hit Southeast Asian data-centre construction.","digestN":64,"opinion":false},{"n":65,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Tech leaders urge Canada to build data centres here or risk renting abroad","url":"https://www.theglobeandmail.com/business/technology/article-tech-leaders-urge-canada-to-build-data-centres-here-or-risk-renting/","summary":"Thirty-five Canadian tech leaders gathered by policy group Build Canada, including Shopify president Harley Finkelstein, Neo Financial co-founder Jeff Adamson and Koho CEO Daniel Eberhard, signed an open letter urging Canada to build more data centres. They warn that relying on other countries would limit access to computing power and expose Canada to supply disruptions. 'Data centres will be built whether Canada hosts them or not,' the letter says, framing the choice as building, shaping and earning from them or renting from others. It calls data centres crucial to AI adoption and essential for internet use, cancer screening, wildfire prediction and business and government software.","digestN":65,"opinion":false},{"n":66,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Ottawa begins rolling out $700-million in AI compute funding under new sector-based approach","url":"https://www.theglobeandmail.com/business/technology/article-ottawa-rolling-out-700-million-in-ai-compute-funding-evan-solomon/","summary":"Ottawa is opening $700-million in its AI Compute Access Fund to help Canadian companies pay for the processing power needed to develop AI applications, while steering them toward homegrown providers. Big tech firms and well-funded startups have bought up much of the world's compute, leaving smaller firms outside tech struggling to find and afford it. The fund, launched in March 2025 with $300-million, subsidizes or finances companies spending $100,000 to $5-million on compute for R&D. Early rounds were heavily oversubscribed, and the budget was raised to $1-billion under the national AI strategy launched in June. The rollout now follows a sector-based approach.","digestN":66,"opinion":false},{"n":67,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Spain’s Pablo Hernández de Cos to take over from Lagarde as European Central Bank chief","url":"https://www.theglobeandmail.com/business/article-pablo-hernandez-de-cos-nominated-new-european-central-bank-head/","summary":"Euro zone countries picked Pablo Hernández de Cos, former Bank of Spain governor and current BIS general manager, as the next ECB president, signalling policy continuity. He succeeds Christine Lagarde when she steps down early on Feb. 7 and chairs his first meeting March 18. His path cleared after the Netherlands backed him, effectively standing down Klaas Knot. The board reshuffle also gives Germany the chief economist role and France oversight of market operations. The ECB faces an Iran war-driven resurgence in inflation and worries that French political turmoil could spread market stress across the euro zone (Reuters).","digestN":67,"opinion":false},{"n":68,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Barlow’s Research Roundup: Top stock picks in the promising midstream energy sector","url":"https://www.theglobeandmail.com/investing/markets/inside-the-market/article-barlows-research-roundup-top-stock-picks-in-the-promising-midstream/","summary":"Scott Barlow's daily research roundup. RBC's Maurice Choy sees a constructive outlook for Canadian midstream stocks, with valuations near long-term averages but widely dispersed. He says WCSB production should accelerate once deals under the trilateral energy MOU are signed, and high commodity prices and disrupted energy flows favour firms with marketing exposure. He names Pembina the clean preferred way to play the backdrop, with Keyera, Enbridge and Rockpoint most able to surprise to the upside. Scotiabank's Maher Yaghi, after hosting former Competition Commissioner John Pecman, says the Quebecor-Telus deal as proposed faces a difficult path, partly because sovereignty arguments carry little weight with the Competition Bureau.","digestN":68,"opinion":false},{"n":69,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Meituan Posts Earnings Beat as Price War Cools","url":"https://www.wsj.com/business/earnings/meituan-posts-earnings-beat-as-price-war-cools-d1380f04","summary":"","digestN":69,"opinion":false},{"n":70,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"How Southwest, Target and AT&T Finance Chiefs Think About the Human in the Loop","url":"https://www.wsj.com/cfo-journal/how-southwest-target-and-at-t-finance-chiefs-think-about-the-human-in-the-loop-c2f175a1","summary":"","digestN":70,"opinion":false},{"n":71,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Sanofi’s CEO, Hired for Turnaround, Starts With Industry’s Biggest Deal","url":"https://www.wsj.com/health/pharma/sanofis-ceo-hired-for-turnaround-starts-with-industrys-biggest-deal-11b47402","summary":"","digestN":71,"opinion":false},{"n":72,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"FTC Imposes Strict Board Restrictions on Beretta’s 25% Stake in Rival Sturm Ruger","url":"https://www.wsj.com/business/ftc-imposes-strict-board-restrictions-on-berettas-25-stake-in-rival-sturm-ruger-2d0cc315","summary":"","digestN":72,"opinion":false},{"n":73,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Lumibird Shares Surge After Thales Targets Majority Stake in $483 Million Laser Deal","url":"https://www.wsj.com/business/deals/lumibird-shares-surge-after-thales-targets-majority-stake-in-483-million-laser-deal-48d6e693","summary":"","digestN":73,"opinion":false},{"n":74,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Arms Maker Rheinmetall Slashes Midterm Forecasts After Order Setbacks","url":"https://www.wsj.com/business/earnings/arms-maker-rheinmetall-slashes-midterm-forecasts-after-order-setbacks-6f24dfad","summary":"","digestN":74,"opinion":false},{"n":75,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"States Move to Block Disney’s Bid for Character.ai Assets","url":"https://www.wsj.com/pro/bankruptcy/states-move-to-block-disneys-bid-for-character-ai-assets-4f21cd2b","summary":"","digestN":75,"opinion":false},{"n":76,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Bank of England Proposes Cut to U.K. Bank Capital Requirements","url":"https://www.wsj.com/business/bank-of-england-proposes-cut-to-u-k-bank-capital-requirements-456b852d" ce":"The Wall Street Journal","section":"WSJ — Economy","author":"","headline":"No Homes to Rent, No Way to Evict: Inside Spain’s Housing Crisis","url":"https://www.wsj.com/world/europe/spain-housing-crisis-d09dc62f","summary":"","digestN":83,"opinion":false},{"n":84,"source":"The Wall Street Journal","section":"WSJ — Economy","author":"","headline":"Australia Orders LNG Exporters Reserve Some Gas to Plug Shortages at Home","url":"https://www.wsj.com/finance/commodities-futures/australia-orders-lng-exporters-reserve-some-gas-to-plug-shortages-at-home-72d6fe9b","summary":"","digestN":84,"opinion":false},{"n":85,"source":"The Wall Street Journal","section":"WSJ — Economy","author":"","headline":"Path for Australian Interest Rates Harder to See","url":"https://www.wsj.com/pro/central-banking/path-for-australian-interest-rates-harder-to-see-2f3ef7f9","summary":"","digestN":85,"opinion":false},{"n":86,"source":"The Wall Street Journal","section":"WSJ — Economy","author":"","headline":"Iranian Drone Attack Kills Two Italians in Kuwait","url":"https://www.wsj.com/world/middle-east/iranian-drone-attack-kills-two-italians-in-kuwait-5e360a35","summary":"","digestN":86,"opinion":false},{"n":87,"source":"The Wall Street Journal","section":"WSJ — Economy","author":"","headline":"New Zealand Election Ends in Deadlock, Turns Outsider Into Kingmaker","url":"https://www.wsj.com/politics/elections/new-zealand-election-ends-in-deadlock-turns-outsider-into-kingmaker-b1708432","summary":"","digestN":87,"opinion":false},{"n":88,"source":"The Wall Street Journal","section":"WSJ — Economy","author":"","headline":"America Hits the Brakes on AI","url":"https://www.wsj.com/opinion/america-hits-the-brakes-on-ai-84a63996","summary":"","digestN":88,"opinion":true},{"n":89,"source":"The Wall Street Journal","section":"WSJ — Markets & Finance","author":"","headline":"Stocks Poised to End Week Strong as Investors Take Break From AI Jitters","url":"https://www.wsj.com/finance/stocks/stocks-poised-to     const PERSIST_PREFIX = 'digest-deck:';

      const d = String(date || '').trim();

      if (typeof INLINE_DATA !== 'undefined' && INLINE_DATA && INLINE_DATA.date) return String(INLINE_DATA.date);

        return (data && typeof data === 'object') ? data : null;

    function savePersistedState() {

        const payload = {

    function go(delta) {

    // Pointer swipe on the stage (works for touch + mouse).
    // Left = next, right = previous. Use the dominant peak travel of the
    // gesture (not the release point) with a moderate equal threshold so
    // both directions actually commit.
    // When the summary is long enough to scroll, touch-action:pan-y keeps
    // vertical scrolling, and once the gesture locks to horizontal we freeze
    // that scroll so the deck swipe can take over.
    let drag = null;
    const SWIPE_MIN = 48;
    function summaryEl() {
      return card.querySelector('.summary');
    }
    function freezeSummaryScroll(freeze) {
      const sum = summaryEl();

        sum.dataset.scrollFrozen = '1';
        sum.dataset.prevOverflowY = sum.style.overflowY || '';
        sum.dataset.prevTouchAction = sum.style.touchAction || '';
        sum.style.overflowY = 'hidden';
        sum.style.touchAction = 'none';

      if (!moved) {

        card.style.opacity = '1';

        return;
      }
      if (maxL >= SWIPE_MIN && maxL > maxR) {

        return;

    function boot(data) {

      state.stories = data.stories;
      state.i = 0;
      state.selected = new Set();
      if (typeof restorePersistedState === 'function') restorePersistedState();
      if (data.date) $('brand').textContent = 'Headlines deck · ' + String(data.date).replace(/^\d{4}-(\d{2})-(\d{2})$/, (_,m,d) => {

    // --- Day switcher: base-relative (works at / on Netlify and /<repo>/ on GitHub Pages) ---
    // siteBase(): site root path ending in '/', derived from location (strips /d/YYYY-MM-DD/...).
    function siteBase() {
      let p = location.pathname || '/';
      const m = p.match(/^(.*\/)d\/\d{4}-\d{2}-\d{2}(\/.*)?$/);
      if (m) return m[1];
      return p.replace(/[^\/]*$/, '') || '/';
    }
    function siteUrl(rel) {
      return siteBase() + String(rel || '').replace(/^\.?\//, '');
    }

    function formatDayLabel(iso, isLatest) {
      const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return iso || '';
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const short = months[Number(m[2]) - 1] + ' ' + Number(m[3]);
      return isLatest ? ('Today · ' + short) : short;
    }

    function detectCurrentDayDate() {
      if (INLINE_DATA && INLINE_DATA.date) return String(INLINE_DATA.date);
      const m = location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})\//);
      return m ? m[1] : '';
    }

    async function initDaySwitcher() {
      const sel = document.getElementById('daySelect');
      if (!sel) return;
      let days = [];
      try {
        const res = await fetch(siteUrl('days.json'), { cache: 'no-store' });
        if (res.ok) days = await res.json();
      } catch (_) {}
      if (!Array.isArray(days) || !days.length) {
        const d = detectCurrentDayDate();
        if (d) {
          days = [{ date: d, label: formatDayLabel(d, true), path: './', latest: true }];
        } else {
          sel.closest('.day-row')?.setAttribute('hidden', '');
          return;
        }
      }
      const current = detectCurrentDayDate();
      sel.innerHTML = '';
      days.forEach((entry, i) => {
        const opt = document.createElement('option');
        const isLatest = !!(entry.latest || i === 0);
        // days.json paths are relative to the site base ('./' or 'd/DATE/'); legacy '/'-rooted ones also OK.
        opt.value = siteUrl(entry.path || (isLatest ? './' : ('d/' + entry.date + '/')));
        opt.textContent = entry.label || formatDayLabel(entry.date, isLatest);
        opt.dataset.date = entry.date || '';
        if (entry.date && entry.date === current) opt.selected = true;
        sel.appendChild(opt);

        if (typeof savePersistedState === 'function') savePersistedState();

        location.href = path;
      });

    initDaySwitcher();


    // --- Section switcher: options built from the stories (contiguous source/section runs, digest order).
    // Stories carrying a navGroup (e.g. the pinned "Coverage & consumer health" block) form ONE group
    // regardless of source, labelled navLabel || NAV_LABELS[navGroup] || navGroup. Days without navGroup
    // keep the plain source/section runs.
    // Choosing a section jumps to that section's first story via goToNumber() (same as Go box / #N).
    // "Titles" is always the last option: a compact, scrollable headline list of every story that day.
    const SECTION_SHORT = { 'The Globe and Mail': 'Globe', 'The Wall Street Journal': 'WSJ', 'Financial Times': 'FT' };
    const NAV_LABELS = { 'Coverage & consumer health': 'Coverage & consumer' };
    const TITLES_VALUE = 'titles';
    const HINT_CARDS = 'Swipe \u2190 / \u2192 \u00b7 Go # \u00b7 Brief me \u00b7 Copy list \u00b7 Clear';
    const HINT_TITLES = 'Tap a headline to select \u00b7 Open to read the article \u00b7 Copy list \u00b7 Clear';
    const sectionNav = { built: false, groups: [], byIndex: [], titlesMode: false, _titlesHooks: false };
    function navGroupOf(s) { return String((s && s.navGroup) || '').trim(); }
    function navLabelFor(s) {
      const g = navGroupOf(s);
      return String((s && s.navLabel) || '').trim() || NAV_LABELS[g] || g;
    }
    function sectionLabelFor(s) {
      const sec = String((s && s.section) || '').trim();
      const src = String((s && s.source) || '').trim();
      const short = SECTION_SHORT[src] || src;
      if (!sec) return short || 'Other';
      if (!short) return sec;
      const low = sec.toLowerCase();
      if (low.includes(short.toLowerCase()) || low.includes(src.toLowerCase())) return sec;
      return short + ' \u2014 ' + sec;
    }
    function sourceBadgeFor(s) {
      const src = String((s && s.source) || '').trim();

    function ensureTitlesPane() {

    function titleRowFor(s, i) {
      const n = s && s.n;

      const row = document.createElement('div');

      head.className = 'titles-headline';
      head.textContent = (s && s.headline) || '';

      badge.className = 'titles-badge';

      const src = sourceBadgeFor(s);
      if (src) badgeBits.push(src);
      if (s && s.opinion) badgeBits.push('Op');
      badge.textContent = badgeBits.join(' \u00b7 ');
      if (!badge.textContent) badge.hidden = true;
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'titles-open';
      open.setAttribute('aria-label', 'Open article in a new tab');
      open.title = 'Open article';
      open.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.2 3h6.8v6.8h-1.6V5.73L4.53 12.6l-1.13-1.13 6.87-6.87H6.2V3z"/></svg>';
      open.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (s && s.url) openExternal(s.url, e);
        else toast('No link for this story');
      });
      row.appendChild(mark);
      row.appendChild(numEl);
      row.appendChild(head);
      row.appendChild(badge);
      row.appendChild(open);
      row.addEventListener('click', (e) => {
        if (e.target.closest('.titles-open')) return;
        toggleBrief(n);
      });
      row.addEventListener('keydown', (e) => {
        if (e.target.closest('.titles-open')) return;
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleBrief(n);
        }
      });
      return row;
    }
    function renderTitlesList() {
      const pane = ensureTitlesPane();
      pane.innerHTML = '';
      const frag = document.createDocumentFragment();
      const groups = sectionNav.groups || [];
      groups.forEach((g, gi) => {
        const h = document.createElement('div');
        h.className = 'titles-h';
        h.textContent = g.label || 'Section';
        frag.appendChild(h);
        const end = groups[gi + 1] ? groups[gi + 1].start : state.stories.length;
        for (let i = g.start; i < end; i++) frag.appendChild(titleRowFor(state.stories[i], i));
      });
      pane.appendChild(frag);
      syncTitlesSelection();
      pane.scrollTop = 0;
    }
    function syncTitlesSelection() {
      const pane = document.getElementById('titlesPane');
      if (pane && !pane.hidden) {
        pane.querySelectorAll('.titles-row').forEach((row) => {
          const on = state.selected.has(Number(row.dataset.n));
          row.classList.toggle('is-selected', on);
          row.setAttribute('aria-checked', on ? 'true' : 'false');
        });
      }
      if (sectionNav.titlesMode) updateTitlesChrome();
    }
    function updateTitlesChrome() {
      if (!sectionNav.titlesMode) return;
      const total = state.stories.length;
      const nSel = state.selected.size;
      const fill = $('progressFill');
      const lab = $('progressLabel');
      if (fill) fill.style.width = '100%';
      if (lab) lab.textContent = nSel ? ('Titles \u00b7 ' + total + ' \u00b7 ' + nSel + ' selected') : ('Titles \u00b7 ' + total);
      document.title = 'Titles \u00b7 Headlines';
      const hint = $('hint');
      if (hint) hint.textContent = HINT_TITLES;
    }
    function enterTitlesView() {
      sectionNav.titlesMode = true;
      const sel = document.getElementById('sectionSelect');
      if (sel) sel.value = TITLES_VALUE;
      const stageEl = document.getElementById('stage');
      if (stageEl) stageEl.setAttribute('hidden', '');
      const pane = ensureTitlesPane();
      pane.removeAttribute('hidden');
      document.body.classList.add('titles-mode');
      renderTitlesList();
      updateTitlesChrome();
    }
    function exitTitlesView() {
      if (!sectionNav.titlesMode) return;
      sectionNav.titlesMode = false;
      const stageEl = document.getElementById('stage');
      if (stageEl) stageEl.removeAttribute('hidden');
      const pane = document.getElementById('titlesPane');
      if (pane) pane.setAttribute('hidden', '');
      document.body.classList.remove('titles-mode');
      const hint = $('hint');
      if (hint) hint.textContent = HINT_CARDS;
    }
    function hookTitlesIntoDeck() {
      if (sectionNav._titlesHooks) return;
      sectionNav._titlesHooks = true;
      if (typeof updateChrome === 'function') {
        const _updateChrome = updateChrome;
        updateChrome = function() {
          if (sectionNav.titlesMode) {
            if (typeof syncSectionSelect === 'function') syncSectionSelect();
            renderSelected();
            if (typeof savePersistedState === 'function') savePersistedState();
            updateTitlesChrome();
            return;
          }
          return _updateChrome.apply(this, arguments);
        };
      }
      if (typeof go === 'function') {
        const _go = go;
        go = function(delta) {
          if (sectionNav.titlesMode) return;
          return _go.apply(this, arguments);
        };
      }
      if (typeof goToNumber === 'function') {
        const _goToNumber = goToNumber;
        goToNumber = function(num, opts) {
          if (sectionNav.titlesMode) exitTitlesView();
          return _goToNumber.call(this, num, opts);
        };
      }
    }
    function buildSectionSelect() {
      const sel = document.getElementById('sectionSelect');
      if (!sel || !state.stories.length) return false;
      hookTitlesIntoDeck();
      const groups = [];
      const byIndex = [];
      let prevKey = null;
      state.stories.forEach((s, i) => {
        const nav = navGroupOf(s);
        const key = nav ? ('\u0002nav\u0001' + nav)
          : (String((s && s.source) || '') + '\u0001' + String((s && s.section) || ''));
        if (key !== prevKey) {
          groups.push({ label: nav ? navLabelFor(s) : sectionLabelFor(s), start: i, first: storyNumber(s, i), last: storyNumber(s, i) });
          prevKey = key;
        }
        const g = groups[groups.length - 1];
        g.last = storyNumber(s, i);
        byIndex.push(groups.length - 1);
      });
      sel.innerHTML = '';
      groups.forEach((g, gi) => {
        const opt = document.createElement('option');
        opt.value = String(gi);
        opt.textContent = g.label + ' (' + (g.first === g.last ? g.first : (g.first + '\u2013' + g.last)) + ')';
        sel.appendChild(opt);
      });
      const titlesOpt = document.createElement('option');
      titlesOpt.value = TITLES_VALUE;
      titlesOpt.textContent = 'Titles';
      sel.appendChild(titlesOpt);
      sectionNav.groups = groups;
      sectionNav.byIndex = byIndex;
      sectionNav.built = true;
      const bar = sel.closest('.section-bar');
      if (bar) bar.removeAttribute('hidden');
      sel.addEventListener('change', () => {
        const val = sel.value;
        sel.blur();
        if (val === TITLES_VALUE) {
          enterTitlesView();
          return;
        }
        if (sectionNav.titlesMode) exitTitlesView();
        const g = sectionNav.groups[Number(val)];
        if (!g) return;
        if (!goToNumber(g.first, { silent: true })) {
          // Fallback: index-in-place if the number lookup fails
          state.i = g.start;
          paintCard();
        }
      });
      // Keep arrow / letter keys inside the select from also driving the deck shortcuts.
      sel.addEventListener('keydown', (e) => e.stopPropagation());
      return true;
    }
    function syncSectionSelect() {
      if (!sectionNav.built && !buildSectionSelect()) return;
      const sel = document.getElementById('sectionSelect');
      if (!sel) return;
      if (sectionNav.titlesMode) {
        if (sel.value !== TITLES_VALUE) sel.value = TITLES_VALUE;
        return;
      }
      const gi = sectionNav.byIndex[state.i];
      if (gi != null && sel.value !== String(gi)) sel.value = String(gi);
    }
    try { boot(INLINE_DATA); }
    catch (err) {
      $('hint').textContent = String(err.message || err);
    }
  </script>
</body>
</html>
