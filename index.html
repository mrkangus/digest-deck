    const $ = (id) => document.getElementById(id);
    const state = { stories: [], i: 0, selected: new Set() };

    // --- localStorage persistence (keyed by digest day; soft-fail if blocked) ---
    const PERSIST_PREFIX = 'digest-deck:';
    function persistKey(date) {
      const d = String(date || '').trim();
      return d ? (PERSIST_PREFIX + d) : '';
    }
    function digestDayDate() {
      if (typeof INLINE_DATA !== 'undefined' && INLINE_DATA && INLINE_DATA.date) return String(INLINE_DATA.date);
      const m = (location.pathname || '').match(/\/d\/(\d{4}-\d{2}-\d{2})\//);
      return m ? m[1] : '';
    }
    function loadPersistedState(date) {
      const key = persistKey(date);
      if (!key) return null;
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const data = JSON.parse(raw);
        return (data && typeof data === 'object') ? data : null;
      } catch (_) {
        return null;
      }
    }
    function savePersistedState() {
      const date = digestDayDate();
      const key = persistKey(date);
      if (!key) return;
      try {
        const s = (typeof current === 'function') ? current() : null;
        const payload = {
          selected: [...state.selected].map(Number).filter(Number.isFinite),
          i: state.i,
          n: (s && s.n != null) ? s.n : null,
          digestN: (s && s.digestN != null) ? s.digestN : null,
        };
        localStorage.setItem(key, JSON.stringify(payload));
      } catch (_) {
        // private mode / quota — deck still works without persistence
      }
    }
    function restorePersistedState() {
      const date = digestDayDate();
      if (!date) return;
      const data = loadPersistedState(date);
      if (!data) return;
      try {
        const valid = new Set(state.stories.map(s => s.n));
        const nums = Array.isArray(data.selected) ? data.selected : [];
        state.selected = new Set(nums.map(Number).filter(n => valid.has(n)));
      } catch (_) {}
      // URL jump (#N / ?n=) wins over saved card position
      if (typeof parseJumpTarget === 'function' && parseJumpTarget()) return;
      let idx = -1;
      if (data.digestN != null && typeof indexForNumber === 'function') idx = indexForNumber(data.digestN);
      if (idx < 0 && data.n != null) idx = state.stories.findIndex(s => s.n === data.n);
      if (idx < 0 && Number.isFinite(Number(data.i))) {
        idx = Math.max(0, Math.min(state.stories.length - 1, Number(data.i)));
      }
      if (idx >= 0) state.i = idx;
    }
    window.addEventListener('pagehide', () => { try { savePersistedState(); } catch (_) {} });

    const card = $('card');
    const stage = $('stage');
    const toastEl = $('toast');

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function current() {
      return state.stories[state.i] || null;
    }

    function renderSelected() {
      const nums = [...state.selected].map(n => {
        const st = state.stories.find(x => x.n === n);
        return (st && st.digestN != null) ? st.digestN : n;
      }).sort((a,b)=>a-b);
      $('btnCopy').textContent = nums.length
        ? `Copy brief list (${nums.length})`
        : 'Copy brief list';
      $('selectedList').textContent = nums.length
        ? `Selected: ${nums.join(', ')} — paste into News Headlines chat for detailed briefs.`
        : 'No stories selected for briefing yet.';
      const clearBtn = $('btnClear');
      if (clearBtn) clearBtn.disabled = !nums.length;
      const brief = card.querySelector('[data-brief]');
      const s = current();
      if (brief && s) {
        const on = state.selected.has(s.n);
        brief.classList.toggle('on', on);
        brief.textContent = on ? 'Selected ✓' : 'Brief me';
      }
      const pillHost = card.querySelector('[data-meta]');
      if (pillHost && s) {
        const existing = pillHost.querySelector('.pill.selected');
        const on = state.selected.has(s.n);
        if (on && !existing) {
          const p = document.createElement('span');
          p.className = 'pill selected';
          p.textContent = 'For brief';
          pillHost.appendChild(p);
        } else if (!on && existing) existing.remove();
      }
    }

    function updateChrome() {
      if (typeof syncSectionSelect === 'function') syncSectionSelect();
      const total = state.stories.length || 1;
      const i = state.i;
      $('progressFill').style.width = (((i + 1) / total) * 100) + '%';
      $('progressLabel').textContent = `${i + 1} / ${total}`;
      const s = current();
      const jump = $('jumpN');
      if (jump && document.activeElement !== jump) {
        const num = s && s.digestN != null ? s.digestN : (s ? s.n : '');
        jump.value = num === '' ? '' : String(num);
        jump.max = String(total);
      }
      if (s) {
        document.title = `${s.source}: ${s.headline} · Headlines`;
        const hashNum = s.digestN != null ? s.digestN : s.n;
        const want = '#' + hashNum;
        if (location.hash !== want) {
          history.replaceState(null, '', want);
        }
      }
      renderSelected();
      if (typeof savePersistedState === 'function') savePersistedState();
    }

    function paintCard() {
      const s = current();
      card.innerHTML = '';
      if (!s) return;

      const top = document.createElement('div');
      top.className = 'card-top';
      const srcBlock = document.createElement('div');
      srcBlock.className = 'source-block';
      const source = document.createElement('h2');
      source.className = 'source';
      source.textContent = s.source || 'Source';
      srcBlock.appendChild(source);
      const isGlobe = /globe/i.test(String(s.source || ''));
      // Non-Globe: keep author under source when present. Globe authors render in the opinion-tab meta row.
      if (s.author && !isGlobe) {
        // Section label removed from cards (see top-bar section dropdown); author only.
        const row = document.createElement('div');
        row.className = 'section-row';
        const au = document.createElement('div');
        au.className = 'author';
        au.textContent = s.author;
        row.appendChild(au);
        srcBlock.appendChild(row);
      }
      top.appendChild(srcBlock);
      const dig = document.createElement('div');
      dig.className = 'digest';
      dig.textContent = s.digestN != null ? `Digest #${s.digestN}` : `#${s.n}`;
      top.appendChild(dig);
      card.appendChild(top);

      const h = document.createElement('h1');
      h.className = 'headline';
      h.textContent = s.headline;
      card.appendChild(h);

      const sum = document.createElement('p');
      sum.className = 'summary';
      sum.textContent = s.summary || 'Open the story, or tap Brief me and copy the list back into chat.';
      card.appendChild(sum);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.dataset.meta = '1';
      if (s.opinion) {
        const p = document.createElement('span');
        p.className = 'pill opinion';
        p.textContent = 'Opinion';
        meta.appendChild(p);
      }
      // Globe synopsis cards: author sits in the opinion-tab area (beside Opinion, or in that spot if not opinion).
      if (isGlobe && s.author) {
        const p = document.createElement('span');
        p.className = 'pill author-pill';
        p.textContent = s.author;
        meta.appendChild(p);
      }
      if (s.featured) {
        const p = document.createElement('span');
        p.className = 'pill featured';
        p.textContent = s.featured;
        meta.appendChild(p);
      }
      card.appendChild(meta);

      const open = document.createElement('a');
      open.className = 'open';
      open.href = s.url;
      open.target = '_blank';
      open.rel = 'noopener noreferrer';
      open.textContent = 'Open article →';
      open.addEventListener('click', (e) => openExternal(s.url, e));
      card.appendChild(open);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const skip = document.createElement('button');
      skip.type = 'button';
      skip.textContent = 'Skip';
      skip.addEventListener('click', () => go(1));
      const brief = document.createElement('button');
      brief.type = 'button';
      brief.className = 'good';
      brief.dataset.brief = '1';
      brief.textContent = 'Brief me';
      brief.addEventListener('click', () => toggleBrief(s.n));
      actions.appendChild(skip);
      actions.appendChild(brief);
      card.appendChild(actions);

      card.style.transform = 'translateX(0)';
      card.style.opacity = '1';
      updateChrome();
    }


    // Publisher apps (esp. Globe) claim https links via App Links / Universal Links
    // and then fail to load. Prefer the browser the user already has signed-in.
    function openExternal(url, e) {
      if (e) e.preventDefault();
      if (!url) return;
      const ua = navigator.userAgent || '';
      if (/Android/i.test(ua)) {
        try {
          const u = new URL(url);
          const intentUrl =
            'intent://' + u.host + u.pathname + u.search + u.hash +
            '#Intent;scheme=https;package=com.android.chrome;' +
            'S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
          window.location.href = intentUrl;
          return;
        } catch (_) {}
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        window.open(siteUrl('open.html?u=') + encodeURIComponent(url), '_blank', 'noopener,noreferrer');
        return;
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function go(delta) {
      if (!state.stories.length) return;
      const next = Math.max(0, Math.min(state.stories.length - 1, state.i + delta));
      if (next === state.i) {
        // bounce
        card.style.transform = `translateX(${delta < 0 ? 12 : -12}px)`;
        setTimeout(() => { card.style.transform = 'translateX(0)'; }, 120);
        return;
      }
      const dir = next > state.i ? -1 : 1;
      card.style.transform = `translateX(${dir * 28}px)`;
      card.style.opacity = '0.35';
      setTimeout(() => {
        state.i = next;
        paintCard();
      }, 120);
    }

    function indexForNumber(num) {
      const n = Number(num);
      if (!Number.isFinite(n) || n < 1) return -1;
      let idx = state.stories.findIndex(s => s.digestN === n);
      if (idx < 0) idx = state.stories.findIndex(s => s.n === n);
      return idx;
    }

    function goToNumber(num, { silent } = {}) {
      const idx = indexForNumber(num);
      if (idx < 0) {
        if (!silent) toast(`No story #${num}`);
        return false;
      }
      if (idx === state.i) {
        paintCard();
        return true;
      }
      card.style.transform = 'translateX(0)';
      card.style.opacity = '0.35';
      setTimeout(() => {
        state.i = idx;
        paintCard();
      }, 80);
      return true;
    }

    function parseJumpTarget() {
      const params = new URLSearchParams(location.search);
      const q = params.get('n') || params.get('story') || params.get('go');
      if (q) return q;
      const h = (location.hash || '').replace(/^#/, '').trim();
      if (/^\d+$/.test(h)) return h;
      const m = h.match(/^(?:n|story|go)=(\d+)$/i);
      return m ? m[1] : null;
    }

    function toggleBrief(n) {
      if (state.selected.has(n)) state.selected.delete(n);
      else state.selected.add(n);
      const st = state.stories.find(x => x.n === n);
      const label = (st && st.digestN != null) ? st.digestN : n;
      toast(state.selected.has(n) ? `Added #${label}` : `Removed #${label}`);
      renderSelected();
      if (typeof savePersistedState === 'function') savePersistedState();
    }

    async function copyList() {
      const nums = [...state.selected].map(n => {
        const st = state.stories.find(x => x.n === n);
        return (st && st.digestN != null) ? st.digestN : n;
      }).sort((a,b)=>a-b);
      if (!nums.length) {
        toast('Select at least one story first');
        return;
      }
      const text = nums.join(', ');
      try {
        await navigator.clipboard.writeText(text);
        toast(`Copied: ${text}`);
      } catch {
        prompt('Copy these numbers into News Headlines chat:', text);
      }
    }

    function clearBriefList() {
      if (!state.selected.size) {
        toast('Nothing selected');
        return;
      }
      state.selected = new Set();
      renderSelected();
      if (typeof savePersistedState === 'function') savePersistedState();
      toast('Cleared brief list');
    }

    $('btnNext').onclick = () => go(1);
    $('btnPrev').onclick = () => go(-1);
    $('btnCopy').onclick = copyList;
    if ($('btnClear')) $('btnClear').onclick = clearBriefList;
    $('jumpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = $('jumpN').value.trim();
      if (!v) return;
      goToNumber(v);
      $('jumpN').blur();
    });
    $('progressLabel').addEventListener('click', () => {
      const el = $('jumpN');
      el.focus();
      el.select();
    });

    window.addEventListener('hashchange', () => {
      const t = parseJumpTarget();
      if (t) goToNumber(t, { silent: true });
    });

    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowRight' || e.key === 'j') go(1);
      if (e.key === 'ArrowLeft' || e.key === 'k') go(-1);
      if (e.key === 'g' && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        const el = $('jumpN');
        el.focus();
        el.select();
      }
      if (e.key === ' ' || e.key === 'b') {
        e.preventDefault();
        const s = current();
        if (s) toggleBrief(s.n);
      }
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) copyList();
    });

    // Pointer swipe on the stage (works for touch + mouse).
    // Left = next, right = previous. Use the dominant peak travel of the
    // gesture (not the release point) with a moderate equal threshold so
    // both directions actually commit.
    // When the summary is long enough to scroll, touch-action:pan-y keeps
    // vertical scrolling, and once the gesture locks to horizontal we freeze
    // that scroll so the deck swipe can take over.
    let drag = null;
    const SWIPE_MIN = 48;
    function summaryEl() {
      return card.querySelector('.summary');
    }
    function freezeSummaryScroll(freeze) {
      const sum = summaryEl();
      if (!sum) return;
      if (freeze) {
        if (sum.dataset.scrollFrozen === '1') return;
        sum.dataset.scrollFrozen = '1';
        sum.dataset.prevOverflowY = sum.style.overflowY || '';
        sum.dataset.prevTouchAction = sum.style.touchAction || '';
        sum.style.overflowY = 'hidden';
        sum.style.touchAction = 'none';
      } else if (sum.dataset.scrollFrozen === '1') {
        sum.style.overflowY = sum.dataset.prevOverflowY || '';
        sum.style.touchAction = sum.dataset.prevTouchAction || '';
        delete sum.dataset.scrollFrozen;
        delete sum.dataset.prevOverflowY;
        delete sum.dataset.prevTouchAction;
      }
    }
    stage.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, a, input, form')) return;
      drag = {
        id: e.pointerId, x: e.clientX, y: e.clientY,
        moved: false, axis: null, maxRight: 0, maxLeft: 0
      };
      card.classList.add('dragging');
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    }, true);
    stage.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x;
      const dy = e.clientY - drag.y;
      if (dx > drag.maxRight) drag.maxRight = dx;
      if (-dx > drag.maxLeft) drag.maxLeft = -dx;
      if (!drag.axis) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        drag.axis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
        if (drag.axis === 'x') freezeSummaryScroll(true);
      }
      if (drag.axis !== 'x') return;
      drag.moved = true;
      e.preventDefault();
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 280));
    }, { passive: false, capture: true });
    function endDrag(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const maxR = drag.maxRight;
      const maxL = drag.maxLeft;
      const moved = drag.moved;
      drag = null;
      freezeSummaryScroll(false);
      card.classList.remove('dragging');
      if (!moved) {
        card.style.transform = 'translateX(0)';
        card.style.opacity = '1';
        return;
      }
      // Dominant direction by peak distance; same threshold both ways.
      if (maxR >= SWIPE_MIN && maxR >= maxL) {
        go(-1); // right → previous
        return;
      }
      if (maxL >= SWIPE_MIN && maxL > maxR) {
        go(1); // left → next
        return;
      }
      card.style.transform = 'translateX(0)';
      card.style.opacity = '1';
    }
    stage.addEventListener('pointerup', endDrag, true);
    stage.addEventListener('pointercancel', endDrag, true);
    // iOS: native scroll on .summary can ignore pointer preventDefault unless
    // touchmove is non-passive once the gesture is locked horizontal.
    stage.addEventListener('touchmove', (e) => {
      if (!drag || drag.axis !== 'x') return;
      e.preventDefault();
    }, { passive: false, capture: true });


    function boot(data) {
      if (!data || !data.stories || !data.stories.length) throw new Error('empty stories');
      state.stories = data.stories;
      state.i = 0;
      state.selected = new Set();
      if (typeof restorePersistedState === 'function') restorePersistedState();
      if (data.date) $('brand').textContent = 'Headlines deck · ' + String(data.date).replace(/^\d{4}-(\d{2})-(\d{2})$/, (_,m,d) => {
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return months[Number(m)-1] + ' ' + Number(d);
      });
      if (data.title) $('hint').textContent = data.title + ' · swipe or Go #';
      if (data.note) $('selectedList').textContent = data.note;
      const jumpTarget = parseJumpTarget();
      if (jumpTarget) {
        const idx = indexForNumber(jumpTarget);
        if (idx >= 0) state.i = idx;
      }
      paintCard();
    }


    // --- Day switcher: base-relative (works at / on Netlify and /<repo>/ on GitHub Pages) ---
    // siteBase(): site root path ending in '/', derived from location (strips /d/YYYY-MM-DD/...).
    function siteBase() {
      let p = location.pathname || '/';
      const m = p.match(/^(.*\/)d\/\d{4}-\d{2}-\d{2}(\/.*)?$/);
      if (m) return m[1];
      return p.replace(/[^\/]*$/, '') || '/';
    }
    function siteUrl(rel) {
      return siteBase() + String(rel || '').replace(/^\.?\//, '');
    }

    function formatDayLabel(iso, isLatest) {
      const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return iso || '';
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const short = months[Number(m[2]) - 1] + ' ' + Number(m[3]);
      return isLatest ? ('Today · ' + short) : short;
    }

    function detectCurrentDayDate() {
      if (INLINE_DATA && INLINE_DATA.date) return String(INLINE_DATA.date);
      const m = location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})\//);
      return m ? m[1] : '';
    }

    async function initDaySwitcher() {
      const sel = document.getElementById('daySelect');
      if (!sel) return;
      let days = [];
      try {
        const res = await fetch(siteUrl('days.json'), { cache: 'no-store' });
        if (res.ok) days = await res.json();
      } catch (_) {}
      if (!Array.isArray(days) || !days.length) {
        const d = detectCurrentDayDate();
        if (d) {
          days = [{ date: d, label: formatDayLabel(d, true), path: './', latest: true }];
        } else {
          sel.closest('.day-row')?.setAttribute('hidden', '');
          return;
        }
      }
      const current = detectCurrentDayDate();
      sel.innerHTML = '';
      days.forEach((entry, i) => {
        const opt = document.createElement('option');
        const isLatest = !!(entry.latest || i === 0);
        // days.json paths are relative to the site base ('./' or 'd/DATE/'); legacy '/'-rooted ones also OK.
        opt.value = siteUrl(entry.path || (isLatest ? './' : ('d/' + entry.date + '/')));
        opt.textContent = entry.label || formatDayLabel(entry.date, isLatest);
        opt.dataset.date = entry.date || '';
        if (entry.date && entry.date === current) opt.selected = true;
        sel.appendChild(opt);
      });
      if (![...sel.options].some(o => o.selected) && sel.options.length) {
        sel.options[0].selected = true;
      }
      sel.addEventListener('change', () => {
        if (typeof savePersistedState === 'function') savePersistedState();
        const path = sel.value || siteBase();
        // Navigate to day's index; drop hash so jump deep-links don't carry over.
        location.href = path;
      });
    }
    initDaySwitcher();


    // --- Section switcher: options built from the stories (contiguous source/section runs, digest order).
    // Stories carrying a navGroup (e.g. the pinned "Coverage & consumer health" block) form ONE group
    // regardless of source, labelled navLabel || NAV_LABELS[navGroup] || navGroup. Days without navGroup
    // keep the plain source/section runs.
    // Choosing one jumps to that section's first story via goToNumber() (same as Go box / #N).
    const SECTION_SHORT = { 'The Globe and Mail': 'Globe', 'The Wall Street Journal': 'WSJ', 'Financial Times': 'FT' };
    const NAV_LABELS = { 'Coverage & consumer health': 'Coverage & consumer' };
    const sectionNav = { built: false, groups: [], byIndex: [] };
    function navGroupOf(s) { return String((s && s.navGroup) || '').trim(); }
    function navLabelFor(s) {
      const g = navGroupOf(s);
      return String((s && s.navLabel) || '').trim() || NAV_LABELS[g] || g;
    }
    function sectionLabelFor(s) {
      const sec = String((s && s.section) || '').trim();
      const src = String((s && s.source) || '').trim();
      const short = SECTION_SHORT[src] || src;
      if (!sec) return short || 'Other';
      if (!short) return sec;
      const low = sec.toLowerCase();
      if (low.includes(short.toLowerCase()) || low.includes(src.toLowerCase())) return sec;
      return short + ' — ' + sec;
    }
    function storyNumber(s, i) {
      if (s && s.digestN != null) return s.digestN;
      if (s && s.n != null) return s.n;
      return i + 1;
    }
    function buildSectionSelect() {
      const sel = document.getElementById('sectionSelect');
      if (!sel || !state.stories.length) return false;
      const groups = [];
      const byIndex = [];
      let prevKey = null;
      state.stories.forEach((s, i) => {
        const nav = navGroupOf(s);
        const key = nav ? ('\u0002nav\u0001' + nav)
          : (String((s && s.source) || '') + '\u0001' + String((s && s.section) || ''));
        if (key !== prevKey) {
          groups.push({ label: nav ? navLabelFor(s) : sectionLabelFor(s), start: i, first: storyNumber(s, i), last: storyNumber(s, i) });
          prevKey = key;
        }
        const g = groups[groups.length - 1];
        g.last = storyNumber(s, i);
        byIndex.push(groups.length - 1);
      });
      sel.innerHTML = '';
      groups.forEach((g, gi) => {
        const opt = document.createElement('option');
        opt.value = String(gi);
        opt.textContent = g.label + ' (' + (g.first === g.last ? g.first : (g.first + '\u2013' + g.last)) + ')';
        sel.appendChild(opt);
      });
      sectionNav.groups = groups;
      sectionNav.byIndex = byIndex;
      sectionNav.built = true;
      if (groups.length < 2) sel.closest('.section-bar')?.setAttribute('hidden', '');
      sel.addEventListener('change', () => {
        const g = sectionNav.groups[Number(sel.value)];
        sel.blur();
        if (!g) return;
        if (!goToNumber(g.first, { silent: true })) {
          // Fallback: index-in-place if the number lookup fails
          state.i = g.start;
          paintCard();
        }
      });
      // Keep arrow / letter keys inside the select from also driving the deck shortcuts.
      sel.addEventListener('keydown', (e) => e.stopPropagation());
      return true;
    }
    function syncSectionSelect() {
      if (!sectionNav.built && !buildSectionSelect()) return;
      const sel = document.getElementById('sectionSelect');
      const gi = sectionNav.byIndex[state.i];
      if (sel && gi != null && sel.value !== String(gi)) sel.value = String(gi);
    }

    try { boot(INLINE_DATA); }
    catch (err) {
      $('hint').textContent = String(err.message || err);
    }
  </script>
</body>
</html>
