,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Fairfax buys controlling stake in India’s IDBI Bank for $5.6-billion","url":"https://www.theglobeandmail.com/business/article-fairfax-financial-holdings-india-idbi-bank-controlling-stake-56/","summary":"Fairfax Financial is buying a 60.72-per-cent stake in India's IDBI Bank from the Indian government for US$5.6-billion, the largest foreign investment ever in India's financial sector. Fairfax won the auction at 81 rupees a share, above the 75.99-rupee benchmark, beating Emirates NBD in the final round. IDBI is among India's 10 largest banks by market value and was taken over by the state and LIC in 2019 after heavy loan losses. Fairfax plans to combine it with its 49-per-cent stake in Go Digit and its holding in IIFL Capital, repeating bank turnarounds such as Eurobank, which has returned 15 per cent a year, and Bank of Ireland.","digestN":66,"opinion":false},{"n":67,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"‘Not a good omen for the Fed’: U.S. rate hike this month now seen as too close to call as inflation broadens across economy","url":"https://www.theglobeandmail.com/business/economy/article-us-fed-rate-hike-call-seen-tight-as-inflation-heats-up/","summary":"September U.S. CPI rose 3.7 per cent year over year, driven mainly by gasoline prices from the Middle East war, while core CPI rose 2.6 per cent, above the expected 2.5 per cent. Inflation Insights says the surprise was broad-based. Software prices rose a record 28 per cent and toy prices also posted a record increase, reflecting AI-driven demand and tariffs. Raymond James' Eugenio Aleman said broadening inflation is 'not a good omen for the Fed,' and futures now price roughly even odds of a second straight hike under Chair Kevin Warsh at the Oct. 27-28 meeting, a week before the midterms. Others point to cooling job gains as reason to hold.","digestN":67,"opinion":false,"featured":"Globe"},{"n":68,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"TD, BMO among nine banks accused of discriminating against U.S. customers for political reasons","url":"https://www.theglobeandmail.com/business/article-td-and-bmo-among-nine-us-banks-accused-of-debanking-customers/","summary":"The U.S. Office of the Comptroller of the Currency named TD Bank and BMO among nine lenders that it says 'denied, debanked and discriminated' against customers on political or religious grounds between 2020 and 2025. The others are JPMorgan, Bank of America, Citigroup, Wells Fargo, U.S. Bancorp, Capital One and PNC. The review began last year at President Trump's request. BMO referred questions to the Bank Policy Institute, which backed clear standards focused on material financial risk, and TD did not comment. JPMorgan said the report covers a limited number of historical interactions. Debanking is normally used to manage money-laundering, fraud and credit risks.","digestN":68,"opinion":false},{"n":69,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Netflix to lay off 6% of workers as investors question streamer’s growth prospects","url":"https://www.theglobeandmail.com/business/article-netflix-reported-to-cut-about-6-of-jobs/","summary":"Netflix is cutting about 6 per cent of its workforce, roughly 1,000 jobs, its biggest layoffs since 2022, mostly in product, tech, legal and HR, according to a memo from co-CEOs Greg Peters and Ted Sarandos. They said the business is strong and the full-year forecast is on track. Netflix had about 16,000 employees at the end of last year, and its shares are down about 25 per cent this year amid concerns over engagement and competition from YouTube and TikTok. A failed bid for Warner Bros. Discovery assets, which Paramount went on to acquire for US$110-billion, deepened doubts. eMarketer says Netflix still needs a new major revenue stream.","digestN":69,"opinion":false},{"n":70,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"U.S. stocks suffer biggest decline since July as hot inflation data stirs rate-hike worries","url":"https://www.theglobeandmail.com/investing/markets/inside-the-market/market-news/article-premarket-stocks-steady-as-chipmakers-recover-ahead-of-us-inflation/","summary":"The S&P 500 fell 1.11 per cent to 7,718.94 and the Nasdaq 1.88 per cent to 26,692.87, their biggest drops since late July, after hot September CPI data lifted the odds of an October Fed hike to 37 per cent from 22 per cent. Oracle lost 8.8 per cent, CoreWeave 15 per cent and Nebius 10 per cent, while Dell and HPE fell after Barclays downgrades. The chip index dropped 4.3 per cent for a sixth straight decline. The TSX also fell 1.11 per cent, led by a 4.2-per-cent drop in materials as gold fell. Bank of America slid 4.8 per cent after a $1.2-billion provision for regulatory fines, and Bending Spoons jumped 41 per cent on Berkshire's investment.","digestN":70,"opinion":false},{"n":71,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"PNC Revenue Rises on National Expansion","url":"https://www.wsj.com/business/earnings/pnc-revenue-rises-on-national-expansion-5fec02b9","summary":"","digestN":71,"opinion":false},{"n":72,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Bank of New York Mellon Logs Higher Profit, Sales","url":"https://www.wsj.com/business/earnings/bank-of-new-york-mellon-logs-higher-profit-sales-a622dae6","summary":"","digestN":72,"opinion":false},{"n":73,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Lyft Eyes Upscale Corporate Travel as Next Leg of Growth","url":"https://www.wsj.com/business/lyft-eyes-upscale-corporate-travel-as-next-leg-of-growth-c06a8568","summary":"","digestN":73,"opinion":false},{"n":74,"source":"The Wall Street Journal","se     }

    function detectCurrentDayDate() {
      if (INLINE_DATA && INLINE_DATA.date) return String(INLINE_DATA.date);
      const m = location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})\//);
      return m ? m[1] : '';
    }

    async function initDaySwitcher() {
      const sel = document.getElementById('daySelect');
      if (!sel) return;
      let days = [];
      try {
        const res = await fetch(siteUrl('days.json'), { cache: 'no-store' });
        if (res.ok) days = await res.json();
      } catch (_) {}
      if (!Array.isArray(days) || !days.length) {
        const d = detectCurrentDayDate();
        if (d) {
          days = [{ date: d, label: formatDayLabel(d, true), path: './', latest: true }];
        } else {
          sel.closest('.day-row')?.setAttribute('hidden', '');
          return;
        }
      }
      const current = detectCurrentDayDate();
      sel.innerHTML = '';
      days.forEach((entry, i) => {
        const opt = document.createElement('option');
        const isLatest = !!(entry.latest || i === 0);
        // days.json paths are relative to the site base ('./' or 'd/DATE/'); legacy '/'-rooted ones also OK.
        opt.value = siteUrl(entry.path || (isLatest ? './' : ('d/' + entry.date + '/')));
        opt.textContent = entry.label || formatDayLabel(entry.date, isLatest);
        opt.dataset.date = entry.date || '';
        if (entry.date && entry.date === current) opt.selected = true;
        sel.appendChild(opt);
      });
      if (![...sel.options].some(o => o.selected) && sel.options.length) {
        sel.options[0].selected = true;
      }
      sel.addEventListener('change', () => {
        if (typeof savePersistedState === 'function') savePersistedState();
        const path = sel.value || siteBase();
        // Navigate to day's index; drop hash so jump deep-links don't carry over.
        location.href = path;
      });
    }
    initDaySwitcher();


    // --- Section switcher: options built from the stories (contiguous source/section runs, digest order).
    // Stories carrying a navGroup (e.g. the pinned "Coverage & consumer health" block) form ONE group
    // regardless of source, labelled navLabel || NAV_LABELS[navGroup] || navGroup. Days without navGroup
    // keep the plain source/section runs.
    // Choosing one jumps to that section's first story via goToNumber() (same as Go box / #N).
    const SECTION_SHORT = { 'The Globe and Mail': 'Globe', 'The Wall Street Journal': 'WSJ', 'Financial Times': 'FT' };
    const NAV_LABELS = { 'Coverage & consumer health': 'Coverage & consumer' };
    const sectionNav = { built: false, groups: [], byIndex: [] };
    function navGroupOf(s) { return String((s && s.navGroup) || '').trim(); }
    function navLabelFor(s) {
      const g = navGroupOf(s);
      return String((s && s.navLabel) || '').trim() || NAV_LABELS[g] || g;
    }
    function sectionLabelFor(s) {
      const sec = String((s && s.section) || '').trim();
      const src = String((s && s.source) || '').trim();
      const short = SECTION_SHORT[src] || src;
      if (!sec) return short || 'Other';
      if (!short) return sec;
      const low = sec.toLowerCase();
      if (low.includes(short.toLowerCase()) || low.includes(src.toLowerCase())) return sec;
      return short + ' — ' + sec;
    }
    function storyNumber(s, i) {
      if (s && s.digestN != null) return s.digestN;
      if (s && s.n != null) return s.n;
      return i + 1;
    }
    function buildSectionSelect() {
      const sel = document.getElementById('sectionSelect');
      if (!sel || !state.stories.length) return false;
      const groups = [];
      const byIndex = [];
      let prevKey = null;
      state.stories.forEach((s, i) => {
        const nav = navGroupOf(s);
        const key = nav ? ('\u0002nav\u0001' + nav)
          : (String((s && s.source) || '') + '\u0001' + String((s && s.section) || ''));
        if (key !== prevKey) {
          groups.push({ label: nav ? navLabelFor(s) : sectionLabelFor(s), start: i, first: storyNumber(s, i), last: storyNumber(s, i) });
          prevKey = key;
        }
        const g = groups[groups.length - 1];
        g.last = storyNumber(s, i);
        byIndex.push(groups.length - 1);
      });
      sel.innerHTML = '';
      groups.forEach((g, gi) => {
        const opt = document.createElement('option');
        opt.value = String(gi);
        opt.textContent = g.label + ' (' + (g.first === g.last ? g.first : (g.first + '\u2013' + g.last)) + ')';
        sel.appendChild(opt);
      });
      sectionNav.groups = groups;
      sectionNav.byIndex = byIndex;
      sectionNav.built = true;
      if (groups.length < 2) sel.closest('.section-bar')?.setAttribute('hidden', '');
      sel.addEventListener('change', () => {
        const g = sectionNav.groups[Number(sel.value)];
        sel.blur();
        if (!g) return;
        if (!goToNumber(g.first, { silent: true })) {
          // Fallback: index-in-place if the number lookup fails
          state.i = g.start;
          paintCard();
        }
      });
      // Keep arrow / letter keys inside the select from also driving the deck shortcuts.
      sel.addEventListener('keydown', (e) => e.stopPropagation());
      return true;
    }
    function syncSectionSelect() {
      if (!sectionNav.built && !buildSectionSelect()) return;
      const sel = document.getElementById('sectionSelect');
      const gi = sectionNav.byIndex[state.i];
      if (sel && gi != null && sel.value !== String(gi)) sel.value = String(gi);
    }

    try { boot(INLINE_DATA); }
    catch (err) {
      $('hint').textContent = String(err.message || err);
    }
  </script>
</body>
</html>
