    const INLINE_DATA = {"date":"2026-11-26","title":"Morning headlines — Thursday, Nov 26, 2026","note":"174 stories (57 pinned to Coverage & consumer health). Reply with story numbers for detailed briefs.","stories":[{"n":1,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"Thursday’s analyst upgrades and downgrades","url":"https://www.theglobeandmail.com/investing/markets/inside-the-market/article-thursdays-analyst-upgrades-and-downgrades-334/","summary":"Inside the Market's Thursday roundup of analyst moves. TD Cowen's Derek Lessard says Couche-Tard's long-term case is intact after fiscal Q2 EPS of 84 cents, up 8% and 6% above consensus, on stronger European fuel margins. He also points to solid U.S. merchandise trends, with energy drinks, nicotine pouches and foodservice gaining share, plus cost control. He raised his target to $105 from $103 (buy; Street average $100.14), noting the stock trades at 17.4x forward EPS. Desjardins' Chris Li raised his George Weston target to $129 from $117 (buy), arguing the discount to NAV should narrow to 10% from 12%. Also: initiations at outperform on Bombardier and CAE, Desjardins positive on 5N Plus and Chemtrade, and Stifel upgraded Medexus to buy ($9).","digestN":1,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"named","featured":"Globe"},{"n":2,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Couche-Tard Sees Zabka Model Expanding Beyond Poland, Romania","url":"https://www.bloomberg.com/news/articles/2026-11-26/couche-tard-sees-zabka-model-expanding-beyond-poland-romania","summary":"","digestN":2,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"named"},{"n":3,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"Walmart Canada Cuts Marketplace Seller Fees to Expand Its E-Commerce Business","url":"https://retail-insider.com/retail-insider/2026/11/walmart-canada-cuts-marketplace-seller-fees-to-expand-its-e-commerce-business/","summary":"Walmart Canada is trying to attract third-party sellers to its Walmart.ca Marketplace. Under a New-Seller Savings program running to Jan. 31, 2027, sellers who ship themselves get 25% off base referral fees, while sellers using Walmart Fulfillment Services, or remote fulfilment from the U.S., get 50% off. Fulfilment, storage and advertising are also discounted. The program covers first-time domestic and international sellers whose stores went live on or after Feb. 1, 2026. Retail Insider ties it to Walmart's Q3 results, where Canadian e-commerce rose 36% (led by store-fulfilled pickup and delivery) and comps rose 6.4%, and notes the bigger fulfilment discount steers sellers onto Walmart's own logistics.","digestN":3,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T12:10:00+00:00","tradeExcerpt":"Walmart Canada is offering referral-fee discounts of up to 50% and reduced fulfillment and advertising costs to attract third-party Marketplace sellers as its Canadian e-commerce business expands.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named","featured":"Retail Insider"},{"n":4,"source":"CCentral","section":"Coverage & consumer health","author":"","headline":"Alimentation Couche-Tard evaluating Canadian pricing, plans to reduce promotions","url":"https://ccentral.ca/alimentation-couche-tard-evaluating-canadian-pricing-plans-reduce-promotions","summary":"On the Q2 call, Couche-Tard CEO Alex Miller said the company is reviewing its Canadian 'pricing architecture' and cutting the number of promotions, as customers deal with higher costs from the tariff war and the conflict in Iran. Some shoppers are cutting discretionary purchases and others are more careful at the pump. Q2 net earnings were US$691.3M (75 cents a share), down from US$740.6M, on revenue of US$22.5B (from US$17.9B). Miller said high pump prices are weighing on fuel demand in parts of the U.S. and Europe.","digestN":4,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T02:36:14+00:00","tradeExcerpt":"Your bill might look a little different next time you shop at Alimentation Couche-Tard Inc.'s convenience stores.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named","featured":"CCentral"},{"n":5,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"Why President’s Choice Chose Yorkville for Its New Holiday Retail Experience","url":"https://retail-insider.com/retail-insider/2026/11/why-presidents-choice-chose-yorkville-for-its-new-holiday-retail-experience/","summary":"Loblaw has turned a storefront at The Colonnade (131 Bloor St. W.) on Toronto's Mink Mile into a President's Choice holiday dining space, the 'PC Bookable Window', open Nov. 19 to Dec. 19. Guests can dine inside the decorated window, discover holiday products and shop digitally, and passersby can interact with it from the sidewalk. The Ancillary Agency found the site for Loblaw's agency after pitching Yorkville, the Entertainment District, King West and Liberty Village, and did the deal with landlord Morguard. Yorkville won for its foot traffic and luxury setting, putting a mass grocery brand into one of Canada's top luxury shopping districts.","digestN":5,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T15:57:00+00:00","tradeExcerpt":"Loblaw’s President’s Choice Bookable Window brings holiday dining and interactive shopping to Toronto’s Yorkville. Nick Iozzo of The Ancillary Agency explains why The Colonnade was selected for the temporary activation.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named"},{"n":6,"source":"Strategy","section":"Coverage & consumer health","author":"","headline":"Maple Leaf Prime uses play to stand out in crowded category","url":"https://strategyonline.ca/2026/11/25/maple-leaf-prime-uses-play-to-stand-out-in-crowded-category/","summary":"","digestN":6,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T15:32:40+00:00","tradeExcerpt":"Maple Leaf Prime doesn’t exactly have an awareness problem. With brand recognition above 90%, the challenge is giving families a ... Read More","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named"},{"n":7,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Tim Hortons China Is Said to Weigh Options Including Stake Sale","url":"https://www.bloomberg.com/news/articles/2026-11-26/tim-hortons-china-is-said-to-weigh-options-including-stake-sale","summary":"TH International, which runs Tim Hortons in China, is reportedly looking at options that include a stake sale, after its shares fell nearly 60% over the past 12 months on widening losses and missed revenue targets at Tims China (report first carried by Bloomberg). Partial: based on a short trade summary of the Bloomberg story.","digestN":7,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T06:19:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named","featured":"Bloomberg"},{"n":8,"source":"BNN Bloomberg","section":"Coverage & consumer health","author":"","headline":"Investor Outlook: Groupe Dynamite price target cut to $83","url":"https://www.bnnbloomberg.ca/investing/investor-outlook/2026/11/25/investor-outlook-groupe-dynamite-price-target-cut-to-83/","summary":"BNN Bloomberg interview: UBS cut its Groupe Dynamite target to $83 from $112 but kept its buy rating. Executive director Mauricio Serna says UBS is still bullish on the differentiated growth strategy but has cut the valuation multiple to about 20x P/E from 27x. He cites rising caution about consumers, macro uncertainty and a slow start to Q3 at other retailers. The new target still implies 60%+ upside. The shares haven't recovered from a roughly 36% drop in June, when the company cut its store-opening forecast. Q3 results are due Dec. 8. The interview also compares Dynamite with Aritzia and Abercrombie and touches on Spruce Point's short report.","digestN":8,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T19:56:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named","featured":"BNN Bloomberg"},{"n":9,"source":"Ottawa Business Journal","section":"Coverage & consumer health","author":"","headline":"Rideau Centre eyeing ‘right fit’ for rest of Nordstrom space as Dollarama moves in","url":"https://obj.ca/rideau-centre-eyeing-right-fit-for-rest-of-nordstrom-space/","summary":"Cadillac Fairview says it is in no rush to lease the rest of the former Nordstrom space at Ottawa's Rideau Centre, where Dollarama is moving in. EVP of development Brian Salpeter said the firm is thinking about the best concepts for the remaining space. Partial: only the opening of the Ottawa Business Journal piece is public.","digestN":9,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T21:12:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named"},{"n":10,"source":"The Business Journals","section":"Coverage & consumer health","author":"","headline":"Aritzia opens second Houston-area fashion boutique in The Woodlands","url":"https://www.bizjournals.com/houston/news/2026/11/26/aritzia-fashion-boutique-woodlands-market-street.html","summary":"","digestN":10,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T09:00:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named"},{"n":11,"source":"Proactive","section":"Coverage & consumer health","author":"","headline":"Seeing Machines secures loan terms with Magna","url":"https://www.proactiveinvestors.com/companies/news/1102508/seeing-machines-secures-loan-terms-with-magna-1102508.html","summary":"Seeing Machines, the driver-monitoring technology company, has agreed terms with Magna International for a US$64M secured loan (fees included). The loan would replace Seeing Machines' convertible notes and push repayment out to March 31, 2028. Magna has extended the existing notes to Dec. 18, 2026 while binding documents are finalized. Interest is 10% a year in cash, or 10.75% if added to the balance, with a redemption fee of up to 2%. Magna gets first claim on the secured assets, behind HSBC's invoice financing. Seeing Machines' shares jumped on the news.","digestN":11,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T13:28:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named"},{"n":12,"source":"Mobility Plaza","section":"Coverage & consumer health","author":"","headline":"Casey's completes purchase of 24 Pak-A-Sak stores","url":"https://www.mobilityplaza.com/news/casey-s-completes-purchase-of-24-pak-a-sak-stores","summary":"Casey's General Stores has closed its purchase of Pak-A-Sak, taking over all 24 stores of the family-owned Amarillo, Texas, convenience chain. The deal was announced in August and terms weren't disclosed. The stores are mostly in the Amarillo area and nearby Panhandle towns (Dumas, Hereford, Pampa), plus some in Lubbock. Casey's began rebranding the sites this month, adding foodservice such as its handmade pizza, and Pak-A-Sak staff are joining Casey's, which deepens its push into Texas.","digestN":12,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T10:43:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"named"},{"n":13,"source":"Lesprom Network","section":"Coverage & consumer health","author":"","headline":"German pallet lumber prices slip as nearly three-year rally stalls","url":"https://www.lesprom.com/en/news/German_pallet_lumber_prices_slip_as_nearly_three-year_rally_stalls_125459/","summary":"Lesprom reports that prices paid for pallet lumber in Germany fell 0.7% in November from October, a sign that a nearly three-year rally is stalling. Partial: only the opening line of the paywalled item is public.","digestN":13,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T05:05:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"sector"},{"n":14,"source":"ChemAnalyst","section":"Coverage & consumer health","author":"","headline":"US Corrugated Box Prices Expected to Remain Stable in November 2026 Amid Seasonal Demand","url":"https://www.chemanalyst.com/NewsAndDeals/NewsDetails/us-corrugated-box-prices-expected-to-remain-stable-in-45620","summary":"ChemAnalyst says U.S. corrugated box prices held steady in November after rising 1.02% in October. Holiday demand from retailers, e-commerce and distribution networks is supporting volumes, along with food and beverage, agriculture and general manufacturing, but steady procurement and no major supply disruptions kept prices from moving. E-commerce and parcel volumes are partly offsetting weaker demand from manufacturing segments hurt by production moving overseas.","digestN":14,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T09:47:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"sector"},{"n":15,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"Grocery prices haven’t yet seen a big hit from pricey oil – that’s about to change","url":"https://www.theglobeandmail.com/investing/personal-finance/article-grocery-prices-havent-yet-seen-a-big-hit-from-pricey-oil-thats-about/","summary":"Despite this year's oil spike, Canadian groceries were about 0.9% cheaper in October than in March (not seasonally adjusted), according to StatCan. Guelph food economist Michael von Massow says produce didn't fall as much as usual in October (fresh vegetables -1.8% m/m vs -6% a year earlier), an early sign that diesel costs are passing through. Experts expect 'more than regular seasonal increases' this winter, possibly from late 2026, as grocers truck more refrigerated produce from farther away (fresh greens from Southern California, for example). Transport is about 12-15% of the shelf price of fresh produce, so a 50% jump in diesel could lift produce prices 7-8%.","digestN":15,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme","featured":"Globe"},{"n":16,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"Canadian auto-parts makers, Ukrainian defence firms to team up to build military goods in Canada","url":"https://www.theglobeandmail.com/politics/article-canadian-auto-parts-makers-ukrainian-defence-firms-to-build-military/","summary":"Canada's Automotive Parts Manufacturers' Association and the Ukrainian Council of Defence Industry (360+ manufacturers) are signing an MOU at Toronto's Rebuild Ukraine conference to build military goods in Canada for Ukraine. APMA president Flavio Volpe says the auto-parts sector has spare capacity that can shift to uncrewed ground vehicles, drones, drone interceptors and electronic-warfare devices, much as suppliers pivoted to ventilators during COVID. The MOU covers joint ventures, co-production and supply-chain co-operation, with PwC Canada as adviser. Volpe calls it a short-term test of whether parts suppliers can pivot to defence, and it also aims to build up Canada's defence industrial base.","digestN":16,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":17,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"Future of Stellantis Brampton plant remains in limbo as parties agree to more talks","url":"https://www.theglobeandmail.com/business/article-melanie-joly-meeting-with-stellantis-brampton-plant/","summary":"Stellantis, Ottawa, Ontario and Unifor met in Toronto Wednesday over the idled STLA-N plant in Brampton and agreed only to keep talking. The plant employed about 3,000 when it was idled in 2023, and governments and the union are trying to reverse its recent sale to Brampton armoured-vehicle maker Roshel. Unifor's Lana Payne said there would be no further details while talks continue, and Stellantis said it is 'committed to continuing constructive discussions'. Stellantis idled the plant to retool for the Jeep Compass but moved that production to Illinois in 2025 after the U.S. put 25% tariffs on Canadian-made cars. It still operates plants in Toronto and Windsor.","digestN":17,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":18,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"Retailers Have a Secret Weapon, and It’s Good Marketing","url":"https://www.wsj.com/cmo-today/retailers-have-a-secret-weapon-and-its-good-marketing-53aabe99","summary":"WSJ's CMO Today credits marketing for upbeat results at several mid-sized U.S. retailers, even with consumer sentiment near record lows (consumers told BMO they plan to cut holiday spending by $600). Abercrombie posted its 16th straight quarter of growth, helped by marketing in Germany and APAC. Dick's saw early signs of life at Foot Locker on heavily marketed sneakers like Nike's Caitlin Clark line. Kohl's credited its 'North Kohl's' holiday campaign. Dollar Tree raised its outlook on 3.8% traffic growth, which it partly credits to its first national campaign, 'It's All in the Tree'. Burlington was one of the few to report a downturn.","digestN":18,"opinion":false,"origSection":"WSJ — Business","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":19,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"Clearlake’s Wellness Pet sued over hedge-fund blacklist","url":"https://www.wsj.com/articles/clearlakes-wellness-pet-sued-over-hedge-fund-blacklist-4dee3b83","summary":"Clearlake Capital's pet-food maker Wellness Pet is being sued in New York state court by a CastleKnight Management fund. Wellness Pet tried to void more than $34 million of secondary-market loan trades because CastleKnight was on its list of 'disqualified lenders'. CastleKnight wants a court to declare the trades valid. The case challenges buyout firms' widespread use of lender blacklists. Partial: based on the public opening of the WSJ Pro piece.","digestN":19,"opinion":false,"origSection":"WSJ — Business","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":20,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Starbucks Korea Sees Profit Return After 'Tank Day' Backlash","url":"https://www.bloomberg.com/news/articles/2026-11-26/starbucks-korea-sees-profit-return-after-tank-day-backlash","summary":"","digestN":20,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":21,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Shein's Slow India Start Lays Bare Limits of Billionaire Ambani's Retail Might","url":"https://www.bloomberg.com/news/articles/2026-11-26/shein-s-slow-india-start-lays-bare-limits-of-billionaire-ambani-s-retail-might","summary":"","digestN":21,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":22,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Zepbound, Ozempic to Come With New FDA Warning Label During Patient Lawsuits","url":"https://www.bloomberg.com/news/articles/2026-11-25/zepbound-ozempic-to-come-with-new-fda-warning-label-during-patient-lawsuits","summary":"","digestN":22,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":23,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"UK discounter Poundland sinks into administration, 10,000 jobs at risk","url":"https://www.reuters.com/business/retail-consumer/uk-retailer-poundland-preparing-administration-sky-news-says-2026-11-25/","summary":"UK discounter Poundland has gone into administration, putting about 10,000-11,000 jobs at risk, after its U.S. owner Gordon Brothers failed to find a buyer. Stores and distribution centres keep trading for now, but the business is likely to be broken up, with some stores sold to rivals. CEO Barry Williams said Gordon Brothers withdrew all borrowing facilities and bank access on Oct. 27 and hadn't released enough funds since, so the board had 'no alternative'. Union Usdaw accused the owner of forcing the collapse just before Christmas, and Gordon Brothers says it explored every avenue for a whole-company sale. (Text: BBC report of the same story.)","digestN":23,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme","featured":"Reuters"},{"n":24,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"Police use tear gas to disperse fresh Bangladesh garment worker protests","url":"https://www.reuters.com/business/world-at-work/police-use-tear-gas-disperse-fresh-bangladesh-garment-worker-protests-2026-11-26/","summary":"Bangladeshi police fired tear gas and sound grenades Thursday to break up garment workers trying to block a major highway over pay. Protesters set fire to a police motorcycle in Gazipur, a key garment hub. The protest came a day after a government wage board approved a 36% rise in the garment minimum wage, the smallest increase in four decades, despite weeks of protests and calls to double it. The unrest has shut factories, blocked highways and disrupted production in a sector employing over 4 million people, a key sourcing base for global apparel brands. Partial: based on the Reuters lead.","digestN":24,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":25,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"Indian court tightens food labelling proposal, asks global food firms to end 'double standards'","url":"https://www.reuters.com/world/india/india-tightens-food-warning-labels-proposal-new-setback-industry-2026-11-26/","summary":"India's Supreme Court has tightened the government's plan for warning labels on packaged food. It requires separate labels for high salt, sugar and fat rather than the single label proposed, and says multinationals should apply uniform standards across countries. Without naming companies, the court criticized the 'double standards' of global food firms that resist warning labels in India but use them voluntarily elsewhere, and said Indian consumers deserve no less protection or information than those in the U.S. or U.K. The case was brought by health activists and is a setback for packaged-food makers.","digestN":25,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":26,"source":"CBC","section":"Coverage & consumer health","author":"","headline":"Health Canada issues warning on rare risk of vision loss with semaglutide GLP-1 drugs","url":"https://www.cbc.ca/news/health/semaglutide-vision-loss-health-canada-9.7435990","summary":"Health Canada has warned of a 'very rare but serious' risk of vision loss with semaglutide drugs (Ozempic, Rybelsus, Wegovy), following similar warnings in the U.S. and Europe. Its safety review found a possible link to non-arteritic anterior ischemic optic neuropathy (NAION), a permanent and untreatable condition that causes sudden blindness or vision changes from reduced blood flow to the optic nerve. Patients with sudden vision loss or rapidly worsening eyesight are told to seek urgent care.","digestN":26,"opinion":false,"origSection":"CBC","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"theme"},{"n":27,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"IKEA Canada reports $2.82B in FY26 sales as retailer marks 50 years in the country","url":"https://retail-insider.com/retail-insider/2026/11/ikea-canada-reports-2-82b-in-fy26-sales-as-retailer-marks-50-years-in-the-country/","summary":"IKEA Canada's fiscal 2026 sales rose 0.7% to $2.82 billion as it marked 50 years in Canada. Food sales rose 3.3% to $148 million. It counted 32.1 million store visitors and 185.5 million online visits. CEO Selwyn Crittendon said the focus remains on making IKEA more affordable, accessible and convenient as Canadians face economic uncertainty and affordability pressure on household spending. The company also launched a $50,000 Community Space Makeover Contest.","digestN":27,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T11:00:19+00:00","tradeExcerpt":"IKEA Canada reports a 0.7 per cent increase in fiscal 2026 sales, with more than 32 million store visitors, as it announces a $50,000 community makeover initiative.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"theme"},{"n":28,"source":"CCentral","section":"Coverage & consumer health","author":"","headline":"Infinity and beyond: Infinity Mart targets 100-plus Canadian locations with aggressive franchise growth","url":"https://ccentral.ca/infinity-and-beyond-infinity-mart-targets-100-plus-canadian-locations-aggressive-franchise-growth","summary":"Infinity Mart, a Canadian convenience chain with 25 stores in two formats (neighbourhood c-stores and c-stores with fuel), plans to reach more than 100 locations over five years, mainly through franchising. Ontario (Ottawa, Kingston) and Alberta (Calgary, Edmonton) are near-term priorities, and B.C. targets include Surrey, Langley and Abbotsford. A group led by Vatsal Joshi has signed a master development deal for 20 stores in Atlantic Canada. The chain is targeting underserved markets and converting existing convenience and fuel sites, adding a new independent-franchise competitor in a channel Couche-Tard dominates.","digestN":28,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T17:00:00+00:00","tradeExcerpt":"The convenience store chain is accelerating expansion across four provinces through strategic fuel partnerships, store conversions and localized franchising models.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"theme"},{"n":29,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"Business Brief: Dashing through the lows","url":"https://www.theglobeandmail.com/business/article-business-brief-dashing-through-the-lows/","summary":"The Globe's Business Brief looks at how Wall Street's swings reach Canada. Investors already doubting the debt-fuelled AI spending boom got new U.S. tariff proposals and inflation data that strengthened bets on a Fed hike. Coming tests: StatCan's early estimate has Q3 growth slowing to 1.3% annualized from 3.3% (full report Monday), and strong U.S. growth tends to lift Canadian bond yields and fixed mortgage rates. The Big Six start Q4 reporting next Wednesday, with loan-loss provisions the thing to watch. The BoC decides Dec. 9 whether to raise its 2.5% rate again, with Macklem expecting companies to pass on higher costs. Big pension funds' AI exposure and a weaker loonie (pricier imports) round it out.","digestN":29,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":30,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"Locked in: How many Canadians who bought at peak housing prices can’t afford to move?","url":"https://www.theglobeandmail.com/investing/personal-finance/article-locked-in-how-many-canadians-who-bought-at-peak-housing-prices-cant/","summary":"A Globe analysis modelled 2,502 hypothetical outcomes using real 2020-22 purchases in three Ontario markets. In nearly 60% of cases, buyers from the peak couldn't sell and buy another home: after today's values, selling costs and a new down payment, they would use up their equity and need more cash. More than a million homes changed hands on MLS in 2020-22, and CREA's composite price index is down about 23% from the peak. The BoC estimated 60% of mortgages renew in 2025-26 with payments up about 10% and 6%. The authors argue these 'locked-in' owners may be an overlooked bottleneck in the housing recovery.","digestN":30,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer","featured":"Globe"},{"n":31,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"U.S. third-quarter GDP growth revised sharply higher","url":"https://www.theglobeandmail.com/business/article-us-gdp-growth-third-quarter-2026/","summary":"U.S. Q3 GDP was revised up to 4.3% annualized, the fastest in three years, from 3.4% (consensus 3.5%; Q2 was 2.2%), on upgrades to consumer spending and business investment in AI. Consumer spending growth was revised to 4.2% from 3.8%. It is driven mostly by higher-income households whose wealth rose with stocks before the recent AI selloff, while historically low layoffs and moderate hiring support everyone else.","digestN":31,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":32,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"U.S. inflation rises further in October, bolstering odds of successive Fed rate hikes","url":"https://www.theglobeandmail.com/business/article-us-inflation-rises-further-in-october-bolstering-odds-of-successive/","summary":"U.S. PCE inflation rose to 3.8% y/y in October from 3.6% (0.3% m/m after 0.6%), keeping Fed hikes in play. Gas prices rose only 0.8% after a 9.2% jump in September, but food rose 0.4% m/m, the most since April. Core PCE rose to 3.3% y/y from 3.1%, a three-year high, with a third straight 0.3% monthly gain. Spending remains resilient on strong growth and AI investment, but it is concentrated among upper-income households, and there are signs poorer Americans are leaning more on credit.","digestN":32,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":33,"source":"The Globe and Mail","section":"Coverage & consumer health","author":"","headline":"GTA home buyers, sellers in standoff as year winds down","url":"https://www.theglobeandmail.com/real-estate/toronto/article-gta-home-buyers-sellers-in-standoff-as-year-winds-down/","summary":"Toronto-area buyers and sellers are at a standoff heading into year-end, says Harvey Kalles broker Andre Kutyan, who is surprised by how little is happening on either side. Sellers face 'now-or-never' choices: cut the price, pull the listing or hold. One example is a Deer Park townhouse at 67 Heath St. W. bought for $3.3M in 2017. It was listed at $4.895M in October 2025, cut in steps to $3.799M, and relisted this month at $3.495M, since staying under $3.5M matters. Buyers started circling after the cut, but in a stalemate many simply hit pause, and Hamilton-area agents describe a gridlocked market too.","digestN":33,"opinion":false,"origSection":"Globe — Business & Investing","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":34,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"The Race to Make Dinner Delivery More Affordable","url":"https://www.wsj.com/business/hospitality/the-race-to-make-dinner-delivery-more-affordable-deb2df99","summary":"Food delivery is getting cheaper. DoorDash and Uber Eats are waiving delivery fees for more customers and adding subscriber perks, and Walmart and Wonder are bundling restaurant orders with other deliveries. Higher grocery prices have made cooking at home costlier, which changes the math on ordering in. DoorDash agreed last month to buy Instacart for about $17B to build a larger takeout-plus-grocery service. A week later, Uber Eats (replacing Grubhub as Amazon's partner) began offering U.S. Prime members free delivery on restaurant orders of $25+, which Amazon says saves members over $175 a year. Restaurants still mark up menu prices on the apps to offset commissions.","digestN":34,"opinion":false,"origSection":"WSJ — Business","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":35,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"The Mad Dash for Memory Chips—and the Pain It’s Causing Holiday Shoppers","url":"https://www.wsj.com/tech/memory-chip-shortage-ai-electronics-prices-e58a065a","summary":"AI data-centre demand has caused a once-in-a-generation memory-chip shortage, with some memory prices up 10 times in a year. Companies are setting up procurement war rooms, scouring eBay, and even dealing with chip thefts. Holiday electronics will cost more: Apple raised MacBook prices by $100-500 and the iPhone 18 Pro and Pro Max by $100, and Tim Cook calls the shortage 'a hundred-year flood'. The same Xbox now costs 33% more. The upside is that Black Friday deals look more enticing.","digestN":35,"opinion":false,"origSection":"WSJ — Business","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":36,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"German Consumer Confidence Edges Up Despite Worries Over Economy, Inflation","url":"https://www.wsj.com/economy/german-consumer-confidence-edges-up-despite-worries-over-economy-inflation-20ec03af","summary":"Germany's GfK/NIM consumer-climate index rose to -30.2 for December from -30.9, in line with forecasts. NIM's Rolf Buerkl says sentiment is 'stagnating at a low level', slightly below a year ago, which 'does not bode well' for Christmas shopping. Income expectations and willingness to buy rose slightly, but views on the economy and inflation remain weak.","digestN":36,"opinion":false,"origSection":"WSJ — Economy","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":37,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"New Home Sales Surged in October","url":"https://www.wsj.com/economy/housing/new-home-sales-surged-in-october-907a2e0b","summary":"U.S. new single-family home sales jumped 14.2% to 701,000 in October from a downwardly revised 614,000 in September, well above the 645,000 consensus. Inventory fell 1.5% to 470,000 and the median price slipped to $391,300 from $392,600. Partial: based on WSJ's short data brief.","digestN":37,"opinion":false,"origSection":"WSJ — Economy","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":38,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"New Layoff Data Show Job Cuts Down 41% So Far This Year","url":"https://www.wsj.com/economy/jobs/layoffs-2026-tracker-784ea69f","summary":"WSJ's 2026 layoffs tracker, citing Challenger, Gray & Christmas, says U.S. job-cut announcements are running 41% below last year's pace. The latest monthly total cited is about 33,500, the lowest in two years, and tech accounts for more than 30% of cuts this year. Partial: based on the public lead of the tracker page.","digestN":38,"opinion":false,"origSection":"WSJ — Economy","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":39,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"U.S. Jobless Claims Fall More Than Expected","url":"https://www.wsj.com/economy/jobs/u-s-jobless-claims-fall-more-than-expected-6a544eff","summary":"U.S. initial jobless claims fell to 189,000 in the week to Nov. 21 from a downwardly revised 202,000, well below the 200,000 expected. Continuing claims dropped 95,000 to just under 1.7 million. The data show a labour market still 'humming along', which raises the odds of Fed tightening. Partial: based on the WSJ lead.","digestN":39,"opinion":false,"origSection":"WSJ — Economy","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":40,"source":"The Wall Street Journal","section":"Coverage & consumer health","author":"","headline":"Brace for the Trump-Warren Credit Card","url":"https://www.wsj.com/opinion/donald-trump-credit-card-interest-rate-cap-7c07e7ca","summary":"WSJ editorial (opinion): Trump says he would work with the new Democratic Congress on a one-year cap on credit-card interest rates ('The credit card companies, they're getting too much'). He has previously promised a 10% cap, as have Elizabeth Warren and Bernie Sanders. The board argues against the deal. Partial: based on the public opening.","digestN":40,"opinion":true,"origSection":"WSJ — Economy","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":41,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Fed Beige Book Shows Moderate Growth, Uptick in Wage Pressures","url":"https://www.bloomberg.com/news/articles/2026-11-25/fed-beige-book-shows-moderate-growth-uptick-in-wage-pressures","summary":"The Fed's Beige Book says most districts saw slight to moderate growth in recent weeks: eight of 12 grew and four were flat. Employment rose slightly and prices rose moderately. Wage and benefit growth picked up to 'moderate' from 'modest', driven by hard-to-fill jobs, cost-of-living adjustments and higher benefit costs. Partial: based on the lead.","digestN":41,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":42,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"US Consumers Press Pause After Strong Spending Last Quarter","url":"https://www.bloomberg.com/news/articles/2026-11-25/us-consumer-spending-stalls-core-pce-rises-0-3-for-third-month","summary":"Inflation-adjusted U.S. consumer spending was flat in October after a strong Q3, suggesting households paused before the holidays. Core PCE rose 0.3% m/m and 3.3% y/y, the most since 2023, and headline inflation hit 3.8%, above the Fed's 2% target for 5.5 years, keeping a December hike on track. Markets expect another hike in Q1 2027. RSM's Joe Brusuelas: 'aggregate demand remains hot, and inflation is accelerating.' Q3 GDP was revised up to 4.3%, but many households are struggling to absorb higher costs.","digestN":42,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer","featured":"Bloomberg"},{"n":43,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"Homebuilder Stock Woes to Persist After Longest Slump Since 2008","url":"https://www.bloomberg.com/news/articles/2026-11-25/homebuilder-stock-woes-to-persist-after-longest-slump-since-2008","summary":"U.S. homebuilder stocks are on track for a third straight annual decline, the longest losing streak since the subprime crisis. Persistent inflation and higher oil prices are raising building-material costs and keeping mortgage rates high, while affordability worries are slowing demand. Profitability at a few key builders is expected to hit a multiyear low in 2027. Partial: based on the opening of the Bloomberg story.","digestN":43,"opinion":false,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":44,"source":"Bloomberg","section":"Coverage & consumer health","author":"","headline":"'Pick Another Protein' Makes Sense This Thanksgiving","url":"https://www.bloomberg.com/opinion/articles/2026-11-25/-pick-another-protein-makes-sense-this-thanksgiving","summary":"","digestN":44,"opinion":true,"origSection":"Bloomberg","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":45,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"Black Friday? No thanks, some brands say","url":"https://www.reuters.com/business/retail-consumer/black-friday-no-thanks-some-brands-say-2026-11-26/","summary":"Some brands are skipping Black Friday to protect margins, make a sustainability point or stand out to shoppers tired of constant promotions. Italy's Pinko is sitting it out for the first time. Chairman Pietro Negra says discounting becomes a vicious cycle and opting out will cost about €2M in revenue, with a much smaller hit to profit. The backdrop is a hard year, with the Iran war reigniting inflation and cash-strapped shoppers needing big discounts. Giants like Amazon can afford to cut prices, but for small brands discounting erodes profitability and willingness to pay full price, and after five years of high inflation shoppers are sceptical of retail pricing.","digestN":45,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":46,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"Retailers face rising AI cyberattack threat ahead of Black Friday, many uninsured","url":"https://www.reuters.com/business/retail-consumer/retailers-face-rising-ai-cyberattack-threat-ahead-black-friday-many-uninsured-2026-11-25/","summary":"Retailers enter Black Friday facing faster, more potent AI-driven cyberattacks while carrying some of the lowest cyber-insurance coverage of any sector. CFC claims data show ransomware attacks on retail, leisure and hospitality are 50% more frequent in November than the monthly average. Only 43% of small and mid-sized retailers have cyber insurance, versus 81% in financial services and 71% in tech. Insurers urge retailers to treat Black Friday as a resilience test as much as a sales opportunity.","digestN":46,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":47,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"'I'm going to drive': FAA outage and high fares reshape Thanksgiving travel plans","url":"https://www.reuters.com/world/us/im-going-drive-faa-outage-high-fares-reshape-thanksgiving-travel-plans-2026-11-25/","summary":"High fares and outages are pushing some Americans to drive for Thanksgiving. Kayak says domestic holiday fares averaged about $469 two weeks out, up about 57% y/y, and Hopper says high jet-fuel costs from the Iran conflict have lifted Thanksgiving and Christmas fares to 10-year highs. A router failure on Nov. 13 caused a nearly five-hour nationwide FAA ground stop affecting 18,000+ flights and about 1 million passengers, followed by United and Delta tech outages. AAA still expects about 81.5 million Americans to travel 50+ miles, only slightly fewer than last year. American Airlines plans 4% more flights.","digestN":47,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":48,"source":"Reuters","section":"Coverage & consumer health","author":"","headline":"New Trump tariffs would likely increase sugar prices in the US","url":"https://www.reuters.com/business/new-trump-tariffs-would-likely-increase-sugar-prices-us-2026-11-25/","summary":"The Trump administration's new tariff plan would add $440 per tonne on raw sugar imported outside the low-tariff quota (TRQ). It is aimed at Brazil, the top exporter, but applies to all suppliers so other countries can't backfill. The U.S. imports about a quarter of its sugar, and analysts and industry groups say the duty would likely raise sugar costs for food makers and consumers.","digestN":48,"opinion":false,"origSection":"Reuters","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":49,"source":"BBC","section":"Coverage & consumer health","author":"","headline":"Parents cutting basics at Christmas, charity warns","url":"https://www.bbc.com/news/articles/cq1k98gpzmy4o","summary":"UK charities warn families will cut back on basics to afford Christmas. A Worthing soup kitchen says demand is high and children asked Father Christmas for food last year. Save the Children research finds 65% of UK parents of under-16s are worried about affording Christmas, and nearly a third will buy fewer presents.","digestN":49,"opinion":false,"origSection":"BBC","navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","pinTier":"consumer"},{"n":50,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"Google Reveals 2026 Canadian Holiday Shopping Trends as AI Use, Nostalgia and Fashion Searches Surge","url":"https://retail-insider.com/retail-insider/2026/11/google-reveals-2026-canadian-holiday-shopping-trends-as-ai-use-nostalgia-and-fashion-searches-surge/","summary":"Google's Canadian holiday insights say shoppers are being more intentional with every dollar. 59% plan to use an AI tool to shop this season, and searches in AI Mode are three times longer than traditional searches as people spell out budgets and recipients. Nostalgia (early-2000s gadgets) and fashion searches are surging. Ipsos finds users 98% more likely to trust YouTube creators' recommendations. Searches for decorative porch geese are up 1,030%, which Google cites as a reason retailers need to stay agile.","digestN":50,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T12:00:00+00:00","tradeExcerpt":"Meta Description: Elkhazin shares holiday shopping trends, including 59% of Canadians planning to use AI, rising fashion searches and a 1,030% surge in porch goose searches.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer"},{"n":51,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"Retail Insider’s Canadian Retail Monitor: November 2026 — Retail Growth Slows Ahead of the Holiday Season","url":"https://retail-insider.com/retail-insider/2026/11/retail-insiders-canadian-retail-monitor-november-2026-retail-growth-slows-ahead-of-the-holiday-season/","summary":"Retail Insider's November monitor: Canadian retail sales rose 0.8% to $75.3B in September, but gas stations made up about 86% of the dollar gain, and volumes and core sales rose only 0.1%, a sharp slowdown from August. Health and personal care, general merchandise and several fashion categories still show strong annual growth, while grocery and parts of home furnishings and electronics are weaker in real terms. Alberta sales are up 12.8% y/y versus 7.5% nationally. StatCan's flash estimate points to a 1.5% drop in October heading into the holidays.","digestN":51,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T08:03:19+00:00","tradeExcerpt":"Canadian retail sales reached $75.3 billion in September, with fuel retailers driving most of the monthly increase. Retail Insider examines sector performance, regional sales, e-commerce, wholesale inventories and inflation ahead of the holiday shopping season.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer","featured":"Retail Insider"},{"n":52,"source":"Canadian Grocer","section":"Coverage & consumer health","author":"","headline":"Recent cyberattacks a ‘warning’ for Canadian grocers, expert says","url":"https://canadiangrocer.com/recent-cyberattacks-warning-canadian-grocers-expert-says","summary":"After hackers hit refrigeration systems at hundreds of French grocery stores in October (one store lost about $80,000 of food), followed by similar incidents elsewhere in Europe, Canadian Grocer asks ESET's Tony Anscombe what grocers should check. His advice: know who can access connected equipment, how those connections are secured, and what happens in an incident, even when an outside contractor manages refrigeration.","digestN":52,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T22:55:24+00:00","tradeExcerpt":"Cybersecurity specialist on why even small retailers are potential targets","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer"},{"n":53,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"Food services and drinking places sector near $9 billion in sales in September: Statistics Canada","url":"https://retail-insider.com/retail-insider/2026/11/food-services-and-drinking-places-sector-near-9-billion-in-sales-in-september-statistics-canada/","summary":"StatCan says Canadian food services and drinking places sales rose 0.2% in September to $8.9B, the ninth straight monthly gain. Full-service restaurants were up 0.4%, limited-service up 0.2%, drinking places flat and special food services down 1.1%. Restaurant food prices were up 3.1% y/y and alcohol in licensed venues up 3.0%. Sales rose in nine provinces, and Quebec fell 0.7%. Restaurants Canada warns stronger sales don't mean healthier restaurants: 67% report lower profitability than a year ago and 44% are pessimistic about 2027.","digestN":53,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T19:59:09+00:00","tradeExcerpt":"Statistics Canada says it was the ninth consecutive monthly increase for the industry.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer"},{"n":54,"source":"Retail Insider","section":"Coverage & consumer health","author":"","headline":"Canadian Black Friday Shoppers Turn to AI and Discounts as Spending Caution Persists","url":"https://retail-insider.com/retail-insider/2026/11/canadian-black-friday-shoppers-turn-to-ai-and-discounts-as-spending-caution-persists/","summary":"A Censuswide survey for Lightspeed Commerce (1,501 Canadians, Oct. 14-22) finds 58.3% plan to shop Black Friday (Nov. 27) or Cyber Monday (Nov. 30). But 51.0% say they've become more cautious with spending over the past six months, 51.1% are hunting for more sales and discounts, and nearly 70% have spent more overall to get a deal. Many also report using AI to research purchases, a sign of deal-driven but restrained holiday spending.","digestN":54,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T16:12:00+00:00","tradeExcerpt":"Lightspeed Commerce research finds 58% of Canadians plan to shop Black Friday or Cyber Monday, even as many remain cautious about spending. The Censuswide survey examines AI-assisted shopping, promotional incentives and differences among major Canadian markets.","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer"},{"n":55,"source":"Digital Commerce 360","section":"Coverage & consumer health","author":"","headline":"Adobe data shows online holiday spending up 9.1% ahead of Thanksgiving","url":"https://www.digitalcommerce360.com/2026/11/25/adobe-online-holiday-spending-data/","summary":"Adobe Analytics says U.S. online spending from Nov. 1-22 reached $82.5B, up 9.1% y/y, across 1 trillion retail site visits, ahead of the Cyber 5 (Thanksgiving to Cyber Monday). Two days topped $4B, a first before Thanksgiving, and every day exceeded $3B. Buy-now-pay-later purchases rose 6.5% to $6.1B. Adobe, Salesforce and others expect November and December e-commerce records, helped by AI shopping agents lifting conversion.","digestN":55,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T17:20:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer","featured":"Digital Commerce 360"},{"n":56,"source":"Mortgage Professional America","section":"Coverage & consumer health","author":"","headline":"Canada mortgage rates face fresh hikes as BMO revises 2027 outlook","url":"https://www.mpamag.com/ca/mortgage-industry/industry-trends/canada-mortgage-rates-face-fresh-hikes-as-bmo-revises-2027-outlook/598867","summary":"BMO Capital Markets (Douglas Porter, Robert Kavcic) raised its 2027 Canada GDP forecast to 2%, after an estimated 1% in 2026 weighed down by U.S. tariffs (50% steel and aluminum, 35% lumber), and it assumes no trade deal. Porter expects the BoC to hike once more ('two rate hikes will be enough') because diesel and heating-oil costs haven't fully reached consumers. B.C. and Ontario are most exposed to continued tightening, a near-term worry for mortgage markets. A trade arrangement would make him 'much, much more optimistic' about 2027.","digestN":56,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-26T06:10:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer"},{"n":57,"source":"Canadian Mortgage Trends","section":"Coverage & consumer health","author":"","headline":"Average Canadian mortgage balance tops $400,000","url":"https://www.canadianmortgagetrends.com/2026/11/average-canadian-mortgage-balance-tops-400000/","summary":"TransUnion Canada's Q3 report says the average mortgage balance hit $401,509 in September, up 8.6% from $369,658 two years earlier, while the number of mortgage borrowers grew under 1%. Total consumer debt reached a record $2.66 trillion, up 3.8% y/y, with mortgages 74% of it. After the BoC's hike to 2.5%, renewing borrowers face higher costs. TransUnion's Matt Fabian says rising utilization, revolving balances, smaller payments and delinquencies on other credit can signal stress before a mortgage payment is missed.","digestN":57,"opinion":false,"navGroup":"Coverage & consumer health","navLabel":"Coverage & consumer","published":"2026-11-25T17:44:00+00:00","tradeExcerpt":"","origSection":"Trade journals — Cdn retail & consumer","pinTier":"consumer","featured":"Canadian Mortgage Trends"},{"n":58,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"China, other U.S. trading partners oppose Trump’s new tariffs plans","url":"https://www.theglobeandmail.com/business/article-china-us-trading-partners-oppose-donald-trump-new-tariffs/","summary":"China, Japan and other U.S. trading partners protested Thursday against planned U.S. tariff hikes on 14 economies that USTR Jamieson Greer says have 'unreasonable' excess manufacturing capacity. The tariffs follow a months-long Section 301 probe and are meant to restore duties after the Supreme Court struck down most of Trump's tariffs in February. They are likely to take effect early next year. China faces a 20% tariff and calls 'overcapacity' a 'false premise' and a pretext for political manoeuvring. The U.S. and China have extended their trade truce by two months from Jan. 10, 2027 and agreed cuts on about US$60B of non-sensitive goods. Japan faces up to 15% and has protested.","digestN":58,"opinion":false,"featured":"Globe"},{"n":59,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Defence entrepreneurs dispel gold-rush mentality amid federal spending boom","url":"https://www.theglobeandmail.com/business/economy/article-defence-entrepreneurs-dispel-gold-rush-mentality-amid-federal-spending/","summary":"Canadian defence startups say Ottawa's spending boom isn't the windfall it appears. Short-term contracts, scarce funding and risk-averse procurement are holding them back. Nextria CEO Ravi Ramsaran told a defence-robotics conference at Ottawa's Area X.O that he keeps having to 'dispel this myth' of a huge pot of money waiting to be claimed. Former defence chief Gen. Wayne Eyre said the assumptions that shaped Canada's security and place in the world are changing rapidly, while Ottawa eases off defence spending increases despite NATO commitments.","digestN":59,"opinion":false},{"n":60,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Nvidia gives the U.S. leverage over China. But the company has leverage over the U.S., too","url":"https://www.theglobeandmail.com/opinion/article-nvidia-gives-the-us-leverage-over-china-but-the-company-has-leverage/","summary":"Opinion (U of T's Carla Norrlöf): Trump personally pressed Nvidia's board to reinstate Jensen Huang less than two weeks after he resigned over affairs, including one with a suspected Chinese intelligence asset. She says this exposes a paradox: American AI dominance gives the U.S. leverage over China, but Washington's dependence on Nvidia creates a domestic choke point. The government both champions Nvidia's commercial success and is supposed to regulate it and protect national security, and export controls on chips hit Nvidia's bottom line, which gives the company leverage over U.S. policy.","digestN":60,"opinion":true},{"n":61,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Premarket: Global stocks climb as traders shrug off latest U.S. tariff salvo","url":"https://www.theglobeandmail.com/investing/markets/inside-the-market/market-news/article-premarket-global-stocks-climb-as-traders-shrug-off-latest-us-tariff/","summary":"European and Asian stocks rose Thursday as the new U.S. tariff proposals on 14 partners (China, Japan, the EU and others) brought no nasty surprises. They won't stack on July's duties and likely won't take effect until February or March. JPMorgan expects a 'modest' macro impact, since the probes were telegraphed, key imports like tech goods stay exempt and the administration has been sensitive to market disruptions. European stocks rose 1.6% and MSCI's global index 0.4%. Wall Street is closed for Thanksgiving, but S&P and Nasdaq futures rose about 0.5% after recovering from Wednesday's early losses. China reserved the right to respond.","digestN":61,"opinion":false},{"n":62,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Canada remains top destination for infrastructure investors, survey finds","url":"https://www.theglobeandmail.com/business/article-canada-remains-top-destination-for-infrastructure-investors-survey/","summary":"Canada kept first place in the Global Infrastructure Investor Association's semi-annual survey of the most attractive infrastructure markets, ahead of the U.S., Mexico and several European and Nordic countries. Canada first took the top spot in May on Ottawa's push to speed up major projects and attract $500B of private investment over five years, and September's Canada Investment Summit drew executives managing about $120 trillion. Investors still want proof of delivery: 45% say flagship projects need private-sector backers as well as public proponents, and 36% want more certainty.","digestN":62,"opinion":false},{"n":63,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Revisiting the SNC-Lavalin affair: How Canada scored a monumental own goal","url":"https://www.theglobeandmail.com/business/commentary/article-revisiting-the-snc-lavalin-affair-how-canada-scored-a-monumental-own/","summary":"Commentary by Lawrence Stevenson, a former chair of SNC-Lavalin (now AtkinsRéalis) and author of a National Business Book Award finalist on the company. He revisits the 2019 SNC-Lavalin affair. He doesn't dispute that a few senior executives committed serious crimes, including bribing Libyan officials, and that the CEO was charged. But he argues the board fired them quickly and installed new leadership, and the real tragedy was Canada's handling of the case afterwards, which did lasting damage to a major company's governance and to Canada's ability to compete globally.","digestN":63,"opinion":true},{"n":64,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Before the Bell: What every Canadian investor needs to know today","url":"https://www.theglobeandmail.com/investing/markets/inside-the-market/article-before-the-bell-what-every-canadian-investor-needs-to-know-today-1611/","summary":"The Globe's pre-open briefing: global markets rose as the latest U.S. tariff salvo looked less damaging than feared, and Thanksgiving gave a break from the AI selloff, with Wall Street closed. TSX futures were positive after the index hit a one-week high on a commodity rally. JPMorgan expects a modest macro impact, citing tech exemptions and the administration's market sensitivity. The STOXX 600 rose about 1.6%, the FTSE 1.5% and the DAX 1.9%. Rogers Sugar reports results today. Oil firmed and the loonie eased against the U.S. dollar.","digestN":64,"opinion":false},{"n":65,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Who’ll pay for overruns on the Darlington small modular reactor? Plus other unanswered questions","url":"https://www.theglobeandmail.com/business/article-wholl-pay-for-overruns-on-the-darlington-small-modular-reactor-and/","summary":"Months into construction, OPG's Darlington New Nuclear Project (four GE BWRX-300 SMRs, a design never built before, in Clarington, Ont.) has hit trouble. On Nov. 10 OPG said the first unit, budgeted at $7.7B of the $20.9B total, will miss its approved budget and its October 2030 in-service date. The Globe explains the setbacks, who could pay for overruns, and how past nuclear projects ran far over budget and schedule with costs landing on consumers.","digestN":65,"opinion":false},{"n":66,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Conservatives push for ethics review of Ottawa’s $1.6-billion Cohere investment","url":"https://www.theglobeandmail.com/politics/article-conservatives-push-ethics-review-ottawa-16-billion-cohere-investment/","summary":"The Conservatives want the Commons ethics committee to study Ottawa's $1.6B investment in AI firm Cohere and possible conflicts of interest. Two recently appointed officials have financial ties to Cohere: Dominic Barton (board chair of Invest in Canada since August) and ex-Google executive Patrick Pichette (head of the new digital transformation agency since September). The motion also calls AI Minister Evan Solomon and will be voted on at a future meeting.","digestN":66,"opinion":false},{"n":67,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Enbridge in talks to sell $1.5-billion pipeline stake to coalition of Indigenous communities","url":"https://www.theglobeandmail.com/business/article-enbridge-talks-15-billion-pipeline-coalition-indigenous-communities/","summary":"Sources say Enbridge is in talks to sell about 6% of its Line 3 crude pipeline for roughly $1.5B to a consortium of more than three dozen First Nation and Métis communities. It would be the largest Indigenous-buyer transaction in Canadian history. Line 3 carries up to 760,000 b/d from Edmonton to Superior, Wis., and is a key part of Enbridge's mainline, which can move up to 3 million b/d. The deal, code-named 'Project Vault', is expected to be announced in early 2027, and terms aren't final.","digestN":67,"opinion":false,"featured":"Globe"},{"n":68,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"LCBO to deploy paid duty cops in over 40 stores to bolster anti-theft efforts","url":"https://www.theglobeandmail.com/canada/toronto/article-lcbo-cops-police-theft-security/","summary":"The LCBO is partnering with police to put paid-duty officers in more than 40 high-risk and busy stores, along with extra guards and a security task force targeting organized crime groups, which it blames for about 70% of theft losses. The Crown agency, one of Ontario's largest retailers, says existing anti-theft measures led to more than 2,000 arrests last year.","digestN":68,"opinion":false},{"n":69,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Market Factors: The five major hallmarks of a finance bubble are all here","url":"https://www.theglobeandmail.com/investing/investment-ideas/article-market-factors-the-five-major-hallmarks-of-a-finance-bubble-are-all/","summary":"Market Factors (Scott Barlow): Richard Bernstein, whose firm Janus Henderson recently bought, sees all five hallmarks of a speculative bubble. (1) Abundant liquidity: Bloomberg's U.S. financial conditions index is at mid-1990s levels. (2) Leverage: margin debt is growing faster than credit-card debt. (3) Volume: Nasdaq volume is about five times pre-dot-com-collapse levels, up 250% since 2020. (4) Household exposure: equities are 35% of U.S. household net worth versus 14% in the early 2000s. (5) Record new issues, just beginning with Anthropic's IPO. He says investors treat stocks like prediction markets. A BofA strategist (a Bernstein protégé) is more optimistic after the selloff.","digestN":69,"opinion":false},{"n":70,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"The next Bank of Canada governor must heed the lessons of the past","url":"https://www.theglobeandmail.com/opinion/article-next-bank-of-canada-governor-lessons-tiff-macklem/","summary":"Opinion: The next Bank of Canada governor must learn from the Macklem era. Macklem took over in 2020 when the focus was avoiding deflation, and the bank used quantitative easing for the first time before inflation surged. Carney, the only former governor ever to oversee the choice of a successor, has his own agenda riding on the pick. The writer welcomes the renewed BoC mandate dropping references to 'maximum sustainable employment' and climate-change impacts, which were added in 2021.","digestN":70,"opinion":true},{"n":71,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Struggling Kensington Capital names new CEO","url":"https://www.theglobeandmail.com/business/article-kensington-capital-names-saar-pikar-as-ceo/","summary":"Kensington Capital founder Tom Kennedy will step down as CEO and become vice-chair on April 1, 2027, after three decades. President Saar Pikar, former head of venture and growth equity at OMERS who joined in July, will become CEO. Bo Cenanovic, ex-OTPP and PSG Equity and head of private equity since July, becomes president. Last week the struggling asset manager reported the worst monthly loss ever for its billion-dollar private-equity fund, which halted redemptions in late 2025.","digestN":71,"opinion":false},{"n":72,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Volatility-weary investors fret as new U.S. tariffs add to tech pain","url":"https://www.theglobeandmail.com/investing/article-volatility-weary-investors-fret-as-new-us-tariffs-add-to-tech-pain/","summary":"Investors are moving into safe havens as Wednesday's U.S. tariff proposals hit markets already shaken by the AI rout. The proposals include country-specific duties on 14 partners (India, Japan, the EU and others) and an extra 20% on China. WisdomTree's Aneeka Gupta: 'We still have not dealt with the fresh shock of Nvidia and tech and now we have tariffs.' The Nasdaq fell 2% Wednesday and is nearly 20% below its early-October record, close to a bear market, erasing the bounce from Huang's reinstatement at Nvidia.","digestN":72,"opinion":false},{"n":73,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"U.S. Justice Department cleared Huang of national-security risk after probing its customers, sources say","url":"https://www.theglobeandmail.com/business/article-us-justice-department-did-not-open-probe-into-jensen-huang-nvidia/","summary":"Three people familiar say the U.S. Justice Department never formally investigated Jensen Huang before Trump pushed for his return as Nvidia CEO, despite his affair with a woman linked to Chinese intelligence. Attorney-General Todd Blanche concluded there was no evidence Huang broke any law, based on ongoing probes of two Nvidia customers, Super Micro Computer and Megaspeed International, which are suspected of smuggling advanced chips to China. That finding could change as the probes continue, and it was key to what Blanche told Trump.","digestN":73,"opinion":false},{"n":74,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Anthropic’s slide tests Wall Street’s lofty bets on future AI profits","url":"https://www.theglobeandmail.com/business/article-anthropics-slide-tests-wall-streets-lofty-bets-on-future-ai-profits/","summary":"Anthropic's fall below its IPO price (around US$80.50 vs the US$83 offer, nearly 30% below its Nov. 19 opening) has sharpened scrutiny of AI valuations. Of 86 Nasdaq-100 companies with positive multiples, 60 saw forward 12-month EPS estimates rise over three months, yet many of those stocks fell, a Reuters/LSEG analysis shows. Investors are questioning whether even the biggest AI winners can earn enough to justify their valuations.","digestN":74,"opinion":false},{"n":75,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Barlow’s Research Roundup: Bank stock investors should be ‘watching for air pockets’, says BofA analyst","url":"https://www.theglobeandmail.com/investing/markets/inside-the-market/article-barlows-research-roundup-bank-stock-investors-should-be-watching-for/","summary":"Barlow's Research Roundup: BofA's Ebrahim Poonawala previews Canadian bank Q4 results ('watching for air pockets'). Banks are well owned, and investors are cautiously optimistic and looking for early signs that the Carney government's investment 'supercycle' is taking hold. With premium valuations, double-digit EPS growth forecasts and expectations of rising ROE, there is little tolerance for disappointment, and he says Q4 is less about the numbers than whether management can validate the 2027 story. Plus more research picks.","digestN":75,"opinion":false,"featured":"Globe"},{"n":76,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"AI stock rout deepens, with Anthropic hitting $74","url":"https://www.theglobeandmail.com/business/article-ai-stocks-slide-on-fears-over-infrastructure-build-out-costs/","summary":"AI stocks fell for a second day Wednesday as worries about costs and debt pushed many leaders to 52-week lows. Anthropic touched US$73.85, 11% below last week's IPO price. Alphabet fell 4.7% to a 52-week low about 35% below its midyear level, and Broadcom fell 5.8%, now 41% below its 2026 high. The selloff partly unwinds earlier optimism, with Democratic midterm wins pointing to more regulation and a slower, costlier AI build-out.","digestN":76,"opinion":false},{"n":77,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"The face of Google in Canada really wants to talk about AI","url":"https://www.theglobeandmail.com/business/rob-magazine/article-the-face-of-google-in-canada-really-wants-to-talk-about-ai/","summary":"ROB Magazine profile of Sabrina Geremia, Google Canada's VP and country managing director and the company's public face in Canada since 2017. Google opened a one-person Toronto sales office in 2001 and now has a few thousand engineers, researchers and salespeople in Waterloo, Toronto and Montreal, plus an Ottawa government office, and it touts $550B of economic impact on Canada. Geremia now wants to talk about AI, even as Google faces parliamentary scrutiny.","digestN":77,"opinion":false},{"n":78,"source":"The Globe and Mail","section":"Globe — Business & Investing","author":"","headline":"Canada puts money down for more F-35s even as it remains undecided on buying them","url":"https://www.theglobeandmail.com/politics/article-canada-puts-money-down-for-f-35s-remains-undecided-on-buying/","summary":"Two officials say Ottawa has made more 'long-lead' payments for F-35 components, now covering up to 48 jets, even though it hasn't decided whether to go ahead with the full 88-aircraft order. They say the payments keep Canada's place in the production queue and are not a decision to buy. Carney ordered a review of the F-35 purchase last year as the trade war with the U.S. deepened.","digestN":78,"opinion":false},{"n":79,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"After Jensen Huang’s Return, Where Does Corporate Governance Go?","url":"https://www.wsj.com/business/after-jensen-huangs-return-where-does-corporate-governance-go-8849b43c","summary":"","digestN":79,"opinion":false},{"n":80,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Li Auto Stuck in Red Despite Sales Growth","url":"https://www.wsj.com/business/earnings/li-auto-stuck-in-red-despite-sales-growth-763e41bb","summary":"","digestN":80,"opinion":false},{"n":81,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"UniCredit Seeks Commerzbank Chair Role for CEO Orcel After Takeover Clears Final Hurdle","url":"https://www.wsj.com/business/unicredit-clears-final-hurdle-in-commerzbank-takeover-83ae477f","summary":"","digestN":81,"opinion":false},{"n":82,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Judge Says FCC Must Stop ABC License Review","url":"https://www.wsj.com/business/media/judge-says-fcc-must-stop-abc-license-review-3748d619","summary":"","digestN":82,"opinion":false},{"n":83,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Dodgers Owner Todd Boehly Clinches Deal for Overseas Assets of Russia’s Lukoil","url":"https://www.wsj.com/business/deals/dodgers-owner-todd-boehly-clinches-deal-for-overseas-assets-of-russias-lukoil-9679356a","summary":"","digestN":83,"opinion":false},{"n":84,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"Fragrance Giants Handed $630 Million in EU, U.K. Antitrust Fines","url":"https://www.wsj.com/business/eu-fines-fragrance-giants-firmenich-givaudan-iff-517-million-over-pricing-f61209c0","summary":"","digestN":84,"opinion":false},{"n":85,"source":"The Wall Street Journal","section":"WSJ — Business","author":"","headline":"SpaceX Gets Approval to Launch One Million Satellites for Orbital Data Centers","url":"https://www.wsj.com/business/fcc-authorizes-spacex-to-build-1-million-data-centers-in-space-0eb20ee7","summary":"","digestN":85,"opinion":
